<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f2ee">
<meta name="robots" content="noindex">
<title>mis finanzas</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ee;--card:#ffffff;--ink:#16181d;--ink2:#3d4048;--muted:#757982;--faint:#a3a6ad;
  --line:#e7e4de;--line2:#f0eee9;
  --green:#17855a;--green-bg:#e4f3eb;
  --amber:#b26b00;--amber-bg:#fcf0dc;
  --red:#c2412d;--red-bg:#fbe8e4;
  --blue:#2f6fd6;--blue-bg:#e6eefb;
  --gold:#c9a84c;
  /* Series (orden fijo) */
  --s1:#2f6fd6;--s2:#eb6834;--s3:#17a673;--s4:#e3a100;--s5:#e07aa0;--s6:#7a5bd1;--s7:#3aa6c4;--s-resto:#c9c6bf;
  /* Plan del mes */
  --p-gasto:#8d8a83;--p-res:#e3a100;--p-inv:#2f6fd6;--p-emer:#17a673;--p-libre:#d9d6cf;
  --tab-h:62px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.4;min-height:100vh;overscroll-behavior-y:contain;font-feature-settings:'tnum' 1,'cv11' 1}
button{font-family:inherit;color:inherit}
b,strong{font-weight:600}

/* NAV */
.nav{position:sticky;top:0;z-index:200;background:rgba(244,242,238,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;padding-top:env(safe-area-inset-top)}
.nav-l{display:flex;align-items:center;min-width:0}
.nav-title{font-family:'Instrument Serif',Georgia,serif;font-size:21px;padding:12px 18px 12px 0;white-space:nowrap;flex-shrink:0}
.nav-title em{font-style:italic;color:var(--gold)}
.tabs{display:flex;gap:2px}
.tab{padding:16px 12px;font-size:14px;cursor:pointer;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:6px;font-weight:500}
.tab svg{display:none}
.tab:hover{color:var(--ink)}.tab.active{color:var(--ink);border-bottom-color:var(--ink)}
.nav-r{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-left:8px}
.upd{font-size:12px;color:var(--muted);white-space:nowrap}
.upd.viejo{color:var(--red)}
.ibtn{background:transparent;border:none;border-radius:50%;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink2)}
.ibtn:hover{background:var(--line2)}
.ibtn.on{background:var(--ink);color:#fff}
.ibtn svg{width:19px;height:19px}
.ibtn.girando svg{animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

.btn{background:var(--ink);color:#fff;border:none;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:default}
.btn-o{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;cursor:pointer;white-space:nowrap}

/* PÁGINAS */
.page{display:none;position:relative;max-width:720px;margin:0 auto;padding:20px 20px 80px}
.page.active{display:block;animation:fi .2s ease}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.titulo{font-size:26px;font-weight:700;letter-spacing:-.4px;line-height:1.15;margin:4px 0 6px}
.bajada{font-size:15px;color:var(--ink2);margin-bottom:18px;line-height:1.45}
.sec{margin-bottom:16px}
.sec-t{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:26px 2px 10px}

.card{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 0 0 1px rgba(0,0,0,.03);margin-bottom:12px;min-width:0}
.card.link{cursor:pointer}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
.card-t{font-size:15px;font-weight:600}
.card-a{font-size:13px;color:var(--blue);cursor:pointer;white-space:nowrap;background:none;border:none;padding:0}
.lbl{font-size:13px;color:var(--muted)}
.big{font-size:32px;font-weight:700;letter-spacing:-.6px;line-height:1.1;margin:2px 0 4px}
.mid{font-size:22px;font-weight:650;letter-spacing:-.3px;line-height:1.15}
.sub{font-size:13.5px;color:var(--ink2);line-height:1.45}
.sub.m2{color:var(--muted)}
.pos{color:var(--green)}.neg{color:var(--red)}.amb{color:var(--amber)}
.muted{color:var(--muted)}

/* Estado principal */
.estado{border-radius:18px;padding:20px;margin-bottom:12px;color:var(--ink)}
.estado.ok{background:var(--green-bg)}
.estado.warn{background:var(--amber-bg)}
.estado.bad{background:var(--red-bg)}
.estado .e-ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:10px;color:#fff}
.estado.ok .e-ic{background:var(--green)}.estado.warn .e-ic{background:var(--amber)}.estado.bad .e-ic{background:var(--red)}
.estado .e-ic svg{width:20px;height:20px}
.estado .e-t{font-size:22px;font-weight:700;letter-spacing:-.3px;line-height:1.2}
.estado .e-s{font-size:14.5px;color:var(--ink2);margin-top:6px;line-height:1.45}

/* Barra de progreso y barra apilada */
.prog{height:10px;background:var(--line2);border-radius:5px;overflow:hidden;margin:12px 0 8px;display:flex}
.prog i{display:block;height:100%;background:var(--green)}
.prog i.amb{background:var(--p-res)}
.stack{display:flex;height:22px;border-radius:7px;overflow:hidden;margin:14px 0 14px;gap:2px;background:var(--line2)}
.stack i{display:block;height:100%;min-width:3px}

/* Pasos del plan */
.pasos{display:flex;flex-direction:column}
.paso{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line2)}
.paso:first-child{border-top:none}
.paso .n{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.paso .pt{flex:1;min-width:0}
.paso .pt div:first-child{font-size:14.5px;font-weight:500}
.paso .pt div+div{font-size:12.5px;color:var(--muted);margin-top:1px}
.paso .pv{font-size:15px;font-weight:600;white-space:nowrap;text-align:right}

/* Medidor de la reserva */
.medidor{position:relative;margin:30px 0 30px}
.medidor .trk{height:12px;border-radius:6px;background:var(--line2);overflow:hidden}
.medidor .fill{height:100%;background:var(--green);border-radius:6px}
.medidor .zona{position:absolute;top:0;height:12px;background:rgba(23,133,90,.13)}
.medidor .tick{position:absolute;top:-6px;width:2px;height:24px;background:var(--ink2);border-radius:1px}
.medidor .tl{position:absolute;font-size:12px;color:var(--muted);transform:translateX(-50%);white-space:nowrap;text-align:center;line-height:1.25}
.medidor .tl.arr{top:-28px}.medidor .tl.ab{top:22px}
.medidor .tl b{color:var(--ink2);font-weight:600}

/* Filas */
.lst{margin:0 -2px}
.li{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line2)}
.lst .li:first-child{border-top:none}
.li .lm{flex:1;min-width:0}
.li .lt{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.li .ls{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.4}
.li .lv{text-align:right;white-space:nowrap;font-size:15px;font-weight:600}
.li .lv small{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.li.click{cursor:pointer}
.li .ic{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.li .ic svg{width:16px;height:16px}
.ic.ok{background:var(--green-bg);color:var(--green)}.ic.warn{background:var(--amber-bg);color:var(--amber)}.ic.bad{background:var(--red-bg);color:var(--red)}.ic.off{background:var(--line2);color:var(--faint)}
.vacio{padding:18px 4px;text-align:center;color:var(--muted);font-size:14px}

.chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap}
.c-ok{background:var(--green-bg);color:var(--green)}
.c-res{background:var(--blue-bg);color:var(--blue)}
.c-warn{background:var(--amber-bg);color:var(--amber)}
.c-bad{background:var(--red-bg);color:var(--red)}
.c-off{background:var(--line2);color:var(--muted)}

/* Desplegables */
details.mas{margin-top:4px}
details.mas>summary{list-style:none;cursor:pointer;font-size:14px;color:var(--blue);padding:10px 2px 2px;display:flex;align-items:center;gap:6px}
details.mas>summary::-webkit-details-marker{display:none}
details.mas>summary::after{content:'';width:7px;height:7px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(45deg);margin-top:-4px;transition:transform .15s}
details.mas[open]>summary::after{transform:rotate(-135deg);margin-top:3px}
details.mes{border-top:1px solid var(--line2)}
details.mes:first-of-type{border-top:none}
details.mes>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 2px}
details.mes>summary::-webkit-details-marker{display:none}
details.mes .det{padding:0 2px 12px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:4px 0;color:var(--ink2)}
.kv span:last-child{white-space:nowrap;font-weight:500}
.kv.tot{border-top:1px solid var(--line2);margin-top:4px;padding-top:8px;font-weight:600;color:var(--ink)}

/* Tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.tiles .card{margin:0}

/* Chips de mes */
.mnav{display:flex;gap:8px;margin:0 -20px 16px;padding:0 20px 2px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.mnav::-webkit-scrollbar{display:none}
.mbtn{padding:8px 14px;border:1px solid var(--line);border-radius:20px;background:var(--card);font-size:14px;cursor:pointer;color:var(--ink2);white-space:nowrap;flex-shrink:0}
.mbtn.active{background:var(--ink);color:#fff;border-color:var(--ink)}

/* Barras horizontales por categoría */
.hb{padding:10px 2px;border-top:1px solid var(--line2);cursor:pointer}
.hb:first-child{border-top:none}
.hb .hh{display:flex;justify-content:space-between;gap:10px;font-size:14.5px}
.hb .hh span:first-child{display:flex;align-items:center;gap:8px;min-width:0}
.hb .hh b{font-weight:600;white-space:nowrap}
.hb .hh small{color:var(--muted);font-size:12.5px;font-weight:400;margin-left:6px}
.hb .tr{height:8px;background:var(--line2);border-radius:4px;margin-top:7px;overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:4px}
.hb.sel{background:var(--line2);margin:0 -10px;padding:10px 12px;border-radius:10px}
.sw{width:10px;height:10px;border-radius:3px;flex-shrink:0;display:inline-block}
.det2{padding:6px 0 4px 18px}
.det2 .kv small{color:var(--muted);font-weight:400}

/* Gráficos */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{font-size:11px;fill:var(--muted);font-family:inherit}
.chart .grid{stroke:var(--line2);stroke-width:1}
.chart .base{stroke:var(--line);stroke-width:1}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2);margin:8px 0 12px}
.leg span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px}
.leg i.ln{height:0;width:16px;border-top:2px dashed var(--muted);border-radius:0}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;border-radius:10px;padding:9px 11px;font-size:12.5px;line-height:1.55;box-shadow:0 6px 20px rgba(0,0,0,.18);opacity:0;transition:opacity .1s;z-index:5;min-width:170px}
.tip.on{opacity:1}
.tip b{font-weight:600;display:block;margin-bottom:2px}
.tip .tr{display:flex;justify-content:space-between;gap:14px}
.tip .tr i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.alerta{display:flex;gap:10px;align-items:flex-start;background:var(--red-bg);color:#7d2416;border-radius:12px;padding:12px 14px;font-size:14px;margin-top:12px;line-height:1.45}
.alerta svg{width:18px;height:18px;flex-shrink:0;margin-top:1px;color:var(--red)}

/* Avisos */
.aviso{background:var(--amber-bg);border-radius:12px;padding:11px 14px;font-size:14px;color:#6b4300;margin-bottom:14px;line-height:1.5}
.aviso.err{background:var(--red-bg);color:var(--red)}
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 60px);transform:translate(-50%,-20px);opacity:0;z-index:150;background:var(--ink);color:#fff;border-radius:20px;padding:7px 15px;font-size:13px;transition:transform .2s,opacity .2s;pointer-events:none}
.ptr.on{transform:translate(-50%,0);opacity:1}

/* Privacidad: oculta montos */
.m{transition:filter .2s}
body.priv .m{filter:blur(8px);user-select:none}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(14,14,14,.45);z-index:500;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:16px}
.modal-bg.on{display:flex}
.modal{background:var(--card);border-radius:18px;padding:22px;width:460px;max-width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h3{font-size:20px;font-weight:700;margin-bottom:6px}
.modal p{font-size:14px;color:var(--muted);line-height:1.5;margin-bottom:16px}
.fg{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fg label{font-size:13px;color:var(--muted)}
.fg input{border:1px solid var(--line);border-radius:10px;background:#fff;font-family:inherit;font-size:15px;outline:none;color:var(--ink);padding:10px 12px;width:100%}
.fg input:focus{border-color:var(--blue)}
.mbt{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.mlink{background:none;border:none;color:var(--muted);font-size:13.5px;text-decoration:underline;cursor:pointer;padding:6px 0}
.msep{height:1px;background:var(--line);margin:18px 0 14px}

/* Bloqueo con PIN */
.lock{position:fixed;inset:0;z-index:1000;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:22px}
.lock.on{display:flex}
.lock h1{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:34px}
.lock h1 em{color:var(--gold)}
.lock .lmsg{font-size:15px;color:var(--muted);min-height:20px;text-align:center}
.lock .lmsg.err{color:var(--red)}
.pdots{display:flex;gap:16px}
.pdots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink)}
.pdots i.f{background:var(--ink)}
.pdots.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{height:72px;border-radius:50%;border:none;background:var(--card);font-size:26px;font-weight:400;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.pad button:active{background:var(--line)}
.pad button.nb{background:none;box-shadow:none;font-size:14px;color:var(--muted)}

.toast{position:fixed;bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,8px);z-index:9999;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(min-width:681px){.toast{bottom:22px}}
@media(max-width:680px){
  .nav{padding:0 10px 0 16px;padding-top:env(safe-area-inset-top);backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  .nav-title{padding:12px 0}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:300;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);gap:0}
  .tab{flex:1;flex-direction:column;gap:3px;padding:8px 2px 8px;font-size:11px;border-bottom:none;border-top:none;margin:0;min-height:var(--tab-h);justify-content:center;font-weight:500}
  .tab.active{color:var(--blue)}
  .tab svg{display:block;width:23px;height:23px}
  .page{padding:16px 16px calc(var(--tab-h) + 40px + env(safe-area-inset-bottom))}
  .mnav{margin:0 -16px 16px;padding:0 16px 2px}
  .titulo{font-size:24px}
  .big{font-size:30px}
}
@media(max-width:360px){.big{font-size:26px}.pad{grid-template-columns:repeat(3,64px)}.pad button{height:64px}}
@media print{.nav,.tabs,.modal-bg,.toast,.lock{display:none!important}.page{display:block!important;padding:0}}
</style>
</head>
<body>

<!-- BLOQUEO -->
<div class="lock" id="lock">
  <h1>mis <em>finanzas</em></h1>
  <div class="lmsg" id="lock-msg">Ingresá tu PIN</div>
  <div class="pdots" id="pdots"><i></i><i></i><i></i><i></i></div>
  <div class="pad" id="pad"></div>
</div>

<nav class="nav">
  <div class="nav-l">
    <div class="nav-title">mis <em>finanzas</em></div>
    <div class="tabs" id="tabs">
      <button class="tab active" data-p="hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hoy</button>
      <button class="tab" data-p="proyeccion"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M4 16l5-5 4 3 7-8"/><path d="M15 6h5v5"/></svg>Proyección</button>
      <button class="tab" data-p="categorias"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Gastos</button>
      <button class="tab" data-p="tarjetas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19M6 15h4"/></svg>Tarjetas</button>
      <button class="tab" data-p="ahorro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l8-6 8 6"/><path d="M6 10v8M10 10v8M14 10v8M18 10v8M3 20h18"/></svg>Ahorro</button>
    </div>
  </div>
  <div class="nav-r">
    <span class="upd" id="upd"></span>
    <button class="ibtn" id="b-refresh" title="Actualizar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    <button class="ibtn" id="b-priv" title="Ocultar montos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    <button class="ibtn" id="b-config" title="Configuración"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </div>
</nav>
<div class="ptr" id="ptr">Soltá para actualizar</div>

<div class="page active" id="page-hoy"></div>
<div class="page" id="page-proyeccion"></div>
<div class="page" id="page-categorias"></div>
<div class="page" id="page-tarjetas"></div>
<div class="page" id="page-ahorro"></div>

<!-- CONFIGURACIÓN -->
<div class="modal-bg" id="m-config">
  <div class="modal">
    <h3>Configuración</h3>
    <p>La app lee la planilla <b>Finanzas personales</b> a través del Apps Script publicado como aplicación web. La URL y el token quedan guardados solo en este dispositivo.</p>
    <div class="fg"><label for="c-url">URL de la aplicación web</label><input id="c-url" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" spellcheck="false"></div>
    <div class="fg"><label for="c-token">Token</label><input id="c-token" type="password" autocomplete="off" spellcheck="false"></div>
    <div class="aviso err" id="c-err" style="display:none"></div>
    <div class="mbt">
      <button class="btn-o" id="c-cancel">Cancelar</button>
      <button class="btn" id="c-save">Probar y guardar</button>
    </div>
    <div class="msep"></div>
    <div class="mbt" style="justify-content:space-between">
      <button class="mlink" id="c-pin">Cambiar PIN</button>
      <button class="mlink" id="c-lock">Bloquear ahora</button>
      <button class="mlink" id="c-clear">Borrar datos del dispositivo</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════
   Mis Finanzas — vista de la planilla "Finanzas personales".
   La app no calcula montos: muestra lo que devuelve el Apps Script.
   localStorage guarda solo: URL, token, PIN (hash), modo privacidad y
   la última respuesta como caché offline.
   ════════════════════════════════════════════════════════════════════ */

const K = {url:'mf_url', token:'mf_token', pin:'mf_pin', priv:'mf_priv', cache:'mf_cache', tab:'mf_tab'};
const ls = {
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let D = null;          // última respuesta de la planilla
let D_AT = null;       // cuándo se obtuvo
let OFFLINE = false;
let ERROR = '';
const UI = {tarMes:null, catMes:null, catSel:null};

/* ── Formato argentino ─────────────────────────────────────────────── */
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sept','oct','nov','dic'];
const MES_IDX = {ene:0,feb:1,mar:2,abr:3,may:4,jun:5,jul:6,ago:7,sep:8,sept:8,set:8,oct:9,nov:10,dic:11};
const nf = {};
function num(v, d){
  const key = d==null ? 'x' : d;
  if(!nf[key]) nf[key] = new Intl.NumberFormat('es-AR', d==null ? {maximumFractionDigits:2} : {minimumFractionDigits:d, maximumFractionDigits:d});
  return nf[key].format(v);
}
// Clave de mes 'YYYY-MM' desde '2026-10-01', 'oct 2026' o 'octubre 2026'
function mesClave(v){
  if(v==null || v==='') return '';
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})/);
  if(m) return m[1]+'-'+m[2];
  m = s.toLowerCase().match(/^([a-zñ]+)\.?\s+(?:de\s+)?(\d{4})$/);
  if(m){ const i = MES_IDX[m[1].slice(0, m[1].startsWith('sept')?4:3)]; if(i!=null) return m[2]+'-'+String(i+1).padStart(2,'0'); }
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m) return m[3]+'-'+m[2].padStart(2,'0');
  return '';
}
function mesTexto(clave){
  const m = String(clave).match(/^(\d{4})-(\d{2})/);
  return m ? MESES[+m[2]-1]+' '+m[1] : String(clave);
}
function mesSumar(clave, n){
  const [y,m] = clave.split('-').map(Number);
  const t = y*12 + (m-1) + n;
  return Math.floor(t/12)+'-'+String(t%12+1).padStart(2,'0');
}
function fechaTexto(v){
  const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[3]+'/'+m[2]+'/'+m[1] : String(v);
}
function fechaCorta(v){
  const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? (+m[3])+' '+MESES[+m[2]-1] : String(v);
}
// Formatea un valor según el tipo de formato que tiene en la planilla.
// cero: qué mostrar cuando el monto es 0 (la planilla muestra "-").
function fmt(v, k, d, cero){
  if(v==null || v==='') return '';
  if(typeof v === 'string' && !/^(mes|fecha)$/.test(k)) return esc(v);
  switch(k){
    case 'mes': return esc(/^\d{4}-\d{2}/.test(v) ? mesTexto(v) : v);
    case 'fecha': return esc(/^\d{4}-\d{2}-\d{2}/.test(v) ? fechaTexto(v) : v);
    case 'ars': case 'usd': {
      const p = k==='usd' ? 'US$\u00a0' : '$\u00a0';
      if(v===0 || Math.abs(v) < Math.pow(10, -(d||0))/2) return '<span class="m">'+(cero!=null?cero:'-')+'</span>';
      return '<span class="m">'+(v<0?'-':'')+p+num(Math.abs(v), d||0)+'</span>';
    }
    case 'pct': return num(v*100, d==null?0:d)+'%';
    case 'num': return num(v, d);
    default: return esc(v);
  }
}
const ars = (v, cero) => typeof v==='number' ? fmt(v,'ars',0,cero) : fmt(v,'txt');

/* ── Acceso a los datos ─────────────────────────────────────────────── */
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
// Índice de columna por nombre de encabezado (exacto, o que empiece igual)
function ci(t, nombre){
  if(!t) return -1;
  const n = norm(nombre);
  let i = t.cols.findIndex(c => norm(c.n)===n);
  if(i<0) i = t.cols.findIndex(c => norm(c.n).startsWith(n));
  return i;
}
// Filas como objetos { campo: {v,k,d} } con acceso por nombre
function filas(t){
  if(!t) return [];
  return t.filas.map(f => ({
    raw: f,
    v: n => { const i = ci(t,n); return i<0 ? '' : f[i]; },
    f: (n, cero) => { const i = ci(t,n); if(i<0) return ''; const c = t.cols[i]; return fmt(f[i], c.k, c.d, cero); }
  }));
}
// Indicador de un bloque etiqueta/valor, buscado por etiqueta (y por celda si cambió el texto)
function ind(lista, patron, celda){
  if(!lista) return null;
  const re = patron instanceof RegExp ? patron : new RegExp('^'+patron, 'i');
  return lista.find(x => re.test(norm(x.l))) || (celda && lista.find(x => x.celda===celda)) || null;
}
const fi = (x, cero) => x ? fmt(x.v, x.k, x.d, cero) : '—';

function mesActual(){
  const x = ind(D.panel.indicadores, 'mes actual', 'B4');
  return x ? mesClave(x.v) : '';
}

/* ── Carga ──────────────────────────────────────────────────────────── */
function urlDatos(){
  const u = ls.get(K.url), t = ls.get(K.token);
  if(!u || !t) return null;
  return u + (u.includes('?')?'&':'?') + 'token=' + encodeURIComponent(t) + '&_=' + Date.now();
}
async function pedir(url){
  const ctl = new AbortController();
  const to = setTimeout(()=>ctl.abort(), 30000);
  try{
    const r = await fetch(url, {cache:'no-store', redirect:'follow', signal:ctl.signal});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    if(!j.ok) throw Object.assign(new Error(j.error || 'Error de la planilla'), {status:j.status});
    return j;
  } catch(e){
    if(e.name==='AbortError') throw new Error('La planilla tardó demasiado en responder.');
    if(e instanceof TypeError) throw Object.assign(new Error('Sin conexión con la planilla.'), {red:true});
    throw e;
  } finally { clearTimeout(to); }
}
let cargando = false;
async function cargar(manual){
  const url = urlDatos();
  if(!url){ abrirConfig(); return; }
  if(cargando) return;
  cargando = true;
  $('b-refresh').classList.add('girando');
  try{
    const j = await pedir(url);
    D = j; D_AT = new Date(); OFFLINE = false; ERROR = '';
    ls.set(K.cache, JSON.stringify({at:D_AT.toISOString(), d:j}));
    if(manual) toast('Datos actualizados');
  } catch(e){
    OFFLINE = !!e.red; ERROR = e.status===403 ? 'El token no es válido. Revisalo en Configuración.' : e.message;
    if(!D) leerCache();
    if(manual || !D) toast(ERROR);
  } finally {
    cargando = false;
    $('b-refresh').classList.remove('girando');
    render();
  }
}
function leerCache(){
  try{
    const c = JSON.parse(ls.get(K.cache) || 'null');
    if(c && c.d){ D = c.d; D_AT = new Date(c.at); }
  } catch(e){}
}

/* ── Render general ─────────────────────────────────────────────────── */
function render(){
  pintarActualizado();
  if(!D){
    const msg = ls.get(K.url)
      ? (ERROR ? '<div class="aviso err">'+esc(ERROR)+'</div>' : '<div class="vacio">Cargando la planilla…</div>')
      : '<div class="aviso">Configurá la URL del Apps Script y el token para ver tus datos.</div><button class="btn" onclick="abrirConfig()">Configurar</button>';
    document.querySelectorAll('.page').forEach(p => p.innerHTML = msg);
    return;
  }
  const pasos = [renderHoy, renderProyeccion, renderCategorias, renderTarjetas, renderAhorro];
  pasos.forEach(fn => { try{ fn(); } catch(e){ console.error(e); } });
}
function pintarActualizado(){
  const el = $('upd');
  if(!D_AT){ el.textContent=''; return; }
  const min = Math.round((Date.now()-D_AT)/60000);
  const hora = D_AT.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  const dia = D_AT.toDateString()===new Date().toDateString() ? hora : fechaCorta(D_AT.toISOString().slice(0,10))+' '+hora;
  el.textContent = (OFFLINE?'sin conexión · ':'') + (min<1 ? 'recién' : dia);
  el.title = 'Datos de la planilla al '+D_AT.toLocaleString('es-AR');
  el.classList.toggle('viejo', OFFLINE || min > 60*12);
}
function avisoEstado(){
  if(OFFLINE) return '<div class="aviso">Sin conexión. Mostrando los datos guardados ('+esc(fechaCorta(D_AT.toISOString().slice(0,10))+', '+D_AT.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false}))+').</div>';
  if(ERROR) return '<div class="aviso err">'+esc(ERROR)+' Mostrando los últimos datos guardados.</div>';
  return '';
}
/* ── Piezas de interfaz ─────────────────────────────────────────────── */
const MESES_L = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const mesLargo = clave => { const m = String(clave).match(/^(\d{4})-(\d{2})/); return m ? MESES_L[+m[2]-1] : String(clave); };
const Mayus = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : s;
const nv = x => (x && typeof x.v==='number') ? x.v : 0;          // número de un indicador
const n0 = v => typeof v==='number' ? v : 0;                       // número de una celda
const $m = v => ars(n0(v), '$ 0');                                 // monto en pesos
const CUBIERTO = 100;                                              // menos de $100 cuenta como cubierto
const IC = {
  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 7v6"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>',
  off:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 12h10"/></svg>',
  alerta:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4"/><circle cx="12" cy="17" r=".5" fill="currentColor"/></svg>'
};
function claseEstado(e){
  const n = norm(e);
  if(n.startsWith('pagado')) return 'c-ok';
  if(n.startsWith('reservado')) return 'c-res';
  if(n.startsWith('parcial')) return 'c-warn';
  if(n.startsWith('pendiente') || n.startsWith('revisar')) return 'c-bad';
  return 'c-off';
}
const pill = e => e ? '<span class="chip '+claseEstado(e)+'">'+esc(e)+'</span>' : '';
const secT = t => '<div class="sec-t">'+t+'</div>';
function prog(parte, total, cls){
  const p = total>0 ? Math.max(0, Math.min(1, parte/total)) : 0;
  return '<div class="prog"><i class="'+(cls||'')+'" style="width:'+(p*100).toFixed(1)+'%"></i></div>';
}
function apilada(segs){
  const tot = segs.reduce((a,s) => a+Math.max(0,s.v), 0);
  if(tot<=0) return '';
  return '<div class="stack" role="img" aria-label="Reparto">'+segs.filter(s => s.v>0).map(s => '<i style="flex:'+s.v+' 1 0;background:'+s.col+'" title="'+esc(s.n)+'"></i>').join('')+'</div>';
}
// Medidor de la reserva de emergencia: valor actual contra las metas mínima y máxima
// Etiqueta del medidor: centrada, o pegada al borde si no entra
const etq = (p, txt, cls) => '<div class="tl '+cls+'" style="'+(p>78 ? 'right:'+(100-p)+'%;transform:translateX(1px);text-align:right' : p<22 ? 'left:'+p+'%;transform:none;text-align:left' : 'left:'+p+'%')+'">'+txt+'</div>';
function medidor(actual, min, max){
  const tope = Math.max(max, actual)*1.08 || 1;
  const x = v => Math.max(0, Math.min(100, v/tope*100));
  return '<div class="medidor">'
    + '<div class="zona" style="left:'+x(min)+'%;width:'+(x(max)-x(min))+'%"></div>'
    + '<div class="trk"><div class="fill" style="width:'+x(actual)+'%"></div></div>'
    + '<div class="tick" style="left:'+x(min)+'%"></div><div class="tick" style="left:'+x(max)+'%"></div>'
    + etq(x(min), '<b>mínimo</b>', 'arr') + etq(x(max), '<b>máximo</b>', 'arr')
    + etq(x(min), $m(min), 'ab') + etq(x(max), $m(max), 'ab')
    + '</div>';
}
function seccionReserva(conAccion){
  const P = D.panel.indicadores, M = D.proyeccion.metas;
  const actual = nv(ind(P,'reserva de emergencia','B9'));
  const min = nv(ind(M,'meta minima de reserva','E5')) || nv(ind(P,'falta para el minimo','B11'))+actual;
  const max = nv(ind(M,'meta maxima de reserva','E6')) || nv(ind(P,'falta para el maximo','B12'))+actual;
  const meses = ind(P,'meses cubiertos','B10');
  const llegaMin = ind(M,'llegas a la meta minima','E7'), llegaMax = ind(M,'llegas a la meta maxima','E8');
  const txtLlega = x => !x ? '' : (mesClave(x.v) ? mesTexto(mesClave(x.v)) : esc(String(x.v)).toLowerCase());
  const faltaMin = Math.max(0, min-actual);
  return '<div class="card'+(conAccion?' link" onclick="irA(\'ahorro\')':'')+'">'
    + '<div class="card-h"><div class="card-t">Reserva de emergencia</div>'+(conAccion?'<button class="card-a">Ver ahorro</button>':'')+'</div>'
    + '<div class="big">'+$m(actual)+'</div>'
    + '<div class="sub">'+(meses?fi(meses)+' meses de gastos cubiertos. ':'')+'La meta es tener entre 3 y 6 meses.</div>'
    + medidor(actual, min, max)
    + '<div class="sub">'+(faltaMin>CUBIERTO ? 'Te faltan <b>'+$m(faltaMin)+'</b> para el mínimo.' : 'Ya pasaste el mínimo.')
    + (llegaMin && faltaMin>CUBIERTO ? ' Siguiendo el plan llegás en <b>'+txtLlega(llegaMin)+'</b>' + (llegaMax ? ' y al máximo '+(mesClave(llegaMax.v)?'en <b>'+txtLlega(llegaMax)+'</b>':'en <b>'+txtLlega(llegaMax)+'</b>') : '') + '.' : '')
    + '</div></div>';
}

/* ── HOY ────────────────────────────────────────────────────────────── */
function renderHoy(){
  const P = D.panel.indicadores, R = D.proyeccion.recomendacion;
  const mes = mesActual(), prox = mes ? mesSumar(mes,1) : '';
  const panelMes = k => filas(D.panel.tabla).find(r => mesClave(r.v('Mes'))===k);
  const proyMes = filas(D.proyeccion.tabla).find(r => mesClave(r.v('Mes'))===mes);

  const faltaHoy = nv(ind(P,'falta cubrir este mes','B7'));
  const fp = panelMes(prox);
  const totProx = fp ? n0(fp.v('Total a pagar')) : 0, cubProx = fp ? n0(fp.v('Pagado o reservado')) : 0, faltaProx = fp ? n0(fp.v('Falta cubrir')) : 0;

  // 1. Estado en una frase
  let h = avisoEstado();
  const okHoy = faltaHoy <= CUBIERTO, okProx = faltaProx <= CUBIERTO;
  const tono = !okHoy ? 'bad' : !okProx ? 'warn' : 'ok';
  const titular = !okHoy ? 'Te faltan '+$m(faltaHoy)+' para pagar '+mesLargo(mes)
    : !okProx ? 'Reservá '+$m(faltaProx)+' para '+mesLargo(prox)
    : 'Estás al día';
  const detalle = (okHoy ? Mayus(mesLargo(mes))+' está todo pago o reservado.' : 'Todavía hay resúmenes de '+mesLargo(mes)+' sin cubrir.')
    + (prox ? (okProx ? ' '+Mayus(mesLargo(prox))+' también está cubierto.' : ' De '+mesLargo(prox)+' ya tenés reservado '+$m(cubProx)+' de '+$m(totProx)+'.') : '');
  h += '<div class="estado '+tono+'"><div class="e-ic">'+(tono==='ok'?IC.ok:IC.warn)+'</div><div class="e-t">'+titular+'</div><div class="e-s">'+detalle+'</div></div>';

  // 2. El mes que viene, tarjeta por tarjeta
  if(fp){
    const res = filas(D.resumenes).filter(r => mesClave(r.v('Mes'))===prox);
    const faltan = res.filter(r => n0(r.v('Falta')) > 0.5).sort((a,b) => n0(b.v('Falta'))-n0(a.v('Falta')));
    const listas = res.filter(r => !(n0(r.v('Falta')) > 0.5) && !norm(r.v('Estado')).startsWith('sin'));
    h += '<div class="card"><div class="card-h"><div class="card-t">'+Mayus(mesLargo(prox))+': '+$m(totProx)+' a pagar</div><button class="card-a" onclick="irA(\'tarjetas\',null,\''+prox+'\')">Detalle</button></div>'
      + prog(cubProx, totProx)
      + '<div class="sub">Reservado <b>'+$m(cubProx)+'</b>'+(totProx>0?' ('+Math.round(cubProx/totProx*100)+'%)':'')+(faltaProx>CUBIERTO?' · falta <b class="neg">'+$m(faltaProx)+'</b>':'')+'</div>'
      + (faltan.length ? '<div class="lst" style="margin-top:10px">'+faltan.map(r =>
          '<div class="li"><div class="ic warn">'+IC.warn+'</div><div class="lm"><div class="lt">'+esc(r.v('Tarjeta o medio'))+'</div>'
          + '<div class="ls">'+(r.v('Notas') ? esc(r.v('Notas')) : 'Total '+r.f('Total del resumen'))+'</div></div>'
          + '<div class="lv neg">'+r.f('Falta')+'<small>falta</small></div></div>').join('')+'</div>' : '')
      + (listas.length ? '<details class="mas"><summary>'+listas.length+(listas.length===1?' ya cubierta':' ya cubiertas')+'</summary><div class="lst">'+listas.map(r =>
          '<div class="li"><div class="ic ok">'+IC.ok+'</div><div class="lm"><div class="lt">'+esc(r.v('Tarjeta o medio'))+'</div></div><div class="lv">'+r.f('Total del resumen')+'</div></div>').join('')+'</div></details>' : '')
      + '</div>';
  }

  // 3. Qué hacer con lo que cobrás este mes
  const ing = ind(R,'ingresos esperados'), resv = ind(R,'reservar ahora','B8'), inv = ind(R,'invertir este mes'), emer = ind(R,'sumar a la reserva'), libre = ind(R,'libre');
  if(ing){
    const gastosMes = proyMes ? n0(proyMes.v('Gastos totales')) : 0;
    const pasos = [
      {n:'Gastos de '+mesLargo(mes)+' sin cubrir', s:'variables estimados y lo que falte pagar', v:gastosMes, col:'var(--p-gasto)'},
      {n:'Reservar para '+mesLargo(prox), s:'lo que falta de las tarjetas y fijos', v:nv(resv), col:'var(--p-res)'},
      {n:'Invertir', s:(ind(D.config.indicadores,'inversion') ? fi(ind(D.config.indicadores,'inversion')) : '20%')+' de lo que cobrás', v:nv(inv), col:'var(--p-inv)'},
      {n:'A la reserva de emergencia', s:'hasta llegar a 6 meses', v:nv(emer), col:'var(--p-emer)'},
      {n:'Libre', s:'para lo que quieras', v:nv(libre), col:'var(--p-libre)'}
    ].filter(p => p.v > CUBIERTO);
    const cobrado = proyMes ? n0(proyMes.v('Ya cobrado')) : 0;
    const porCobrar = proyMes ? n0(proyMes.v('Facturado por cobrar')) : 0, enCurso = proyMes ? n0(proyMes.v('Casos en curso')) + n0(proyMes.v('Casos nuevos')) : 0;
    h += secT('Plan para lo que cobres en '+mesLargo(mes))
      + '<div class="card"><div class="lbl">Ingresos esperados en '+mesLargo(mes)+'</div><div class="big">'+fi(ing,'$ 0')+'</div>'
      + '<div class="sub m2">Ya cobraste '+$m(cobrado)+' · facturado a cobrar '+$m(porCobrar)+(enCurso?' · casos en curso '+$m(enCurso)+' (estimado)':'')+'</div>'
      + apilada(pasos)
      + '<div class="pasos">'+pasos.map((p,i) => '<div class="paso"><div class="n" style="background:'+p.col+'">'+(i+1)+'</div><div class="pt"><div>'+esc(p.n)+'</div><div>'+esc(p.s)+'</div></div><div class="pv">'+$m(p.v)+'</div></div>').join('')+'</div>'
      + '<div class="sub m2" style="margin-top:8px">A medida que cobrás, cubrí los pasos en este orden.</div>'
      + '</div>';
  }

  // 4. Reserva de emergencia
  h += secT('Tu colchón') + seccionReserva(true);

function lectura(v){
  if(!v) return '';
  const n = norm(v);
  const cls = /deficit|falta|no alcanza/.test(n) ? 'c-bad' : /reserva/.test(n) ? 'c-ok' : /invertir/.test(n) ? 'c-res' : 'c-off';
  return '<span class="chip '+cls+'">'+esc(v)+'</span>';
}
// Ancho real del contenedor: el SVG se dibuja 1:1 para que el texto no se achique
const anchoGrafico = cont => Math.max(280, Math.round(cont.clientWidth || 640));
function escala(max){
  if(max<=0) return {max:1, paso:1};
  const exp = Math.pow(10, Math.floor(Math.log10(max)));
  const pasos = [1,2,2.5,5,10].map(x=>x*exp);
  for(const p of pasos){ if(max/p <= 4) return {max:Math.ceil(max/p)*p, paso:p}; }
  return {max, paso:max/4};
}
const corto = v => { const a=Math.abs(v); return (v<0?'-':'')+(a>=1e6 ? num(a/1e6, a>=1e7?0:1)+' M' : a>=1e3 ? num(a/1e3,0)+' mil' : num(a,0)); };
const etiquetaMes = (k, bw) => { const m = MESES[+String(k).slice(5,7)-1] || k; return bw < 26 ? m.charAt(0).toUpperCase() : m; };

function graficoBarras(cont, datos){
  if(!cont || !datos.length) return;
  const W = anchoGrafico(cont), H = 200, pl = 44, pr = 4, pt = 8, pb = 22, iw = W-pl-pr, ih = H-pt-pb;
  const e = escala(Math.max(...datos.map(d => Math.max(d.ing, d.gas))));
  const y = v => pt + ih - v/e.max*ih;
  const bw = iw/datos.length, barW = Math.max(3, Math.min(12, bw*0.32));
  let s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ingresos y gastos proyectados por mes">';
  for(let v=0; v<=e.max+1e-6; v+=e.paso) s += '<line class="grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="ax m" x="'+(pl-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+corto(v)+'</text>';
  const barra = (v, x, col) => { const h = y(0)-y(v); if(h<0.5) return ''; const r = Math.min(3, barW/2, h); const y0 = y(v);
    return '<path d="M'+x+','+y(0)+' V'+(y0+r)+' Q'+x+','+y0+' '+(x+r)+','+y0+' H'+(x+barW-r)+' Q'+(x+barW)+','+y0+' '+(x+barW)+','+(y0+r)+' V'+y(0)+' Z" fill="'+col+'"/>'; };
  datos.forEach((d,i) => {
    const cx = pl + bw*i + bw/2;
    s += barra(d.ing, cx-barW-1, 'var(--s3)') + barra(d.gas, cx+1, d.gas>d.ing ? 'var(--red)' : 'var(--s2)');
    s += '<text class="ax" x="'+cx+'" y="'+(H-6)+'" text-anchor="middle">'+etiquetaMes(d.mes, bw)+'</text>';
  });
  s += '<line class="base" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(0)+'" y2="'+y(0)+'"/>';
  s += '<line class="hl" x1="0" x2="0" y1="'+pt+'" y2="'+(pt+ih)+'" stroke="var(--faint)" stroke-dasharray="3 3" style="display:none"/></svg>';
  cont.querySelector('.ch-svg').innerHTML = s;
  hover(cont, datos.length, i => { const d = datos[i];
    return '<b>'+mesTexto(d.mes)+'</b><div class="tr"><span><i style="background:var(--s3)"></i>Ingresos</span><span>'+$m(d.ing)+'</span></div>'
      + '<div class="tr"><span><i style="background:var(--s2)"></i>Gastos</span><span>'+$m(d.gas)+'</span></div>'
      + '<div class="tr"><span>Queda</span><span>'+$m(d.ing-d.gas)+'</span></div>'; }, {pl, iw, W});
}
function graficoReserva(cont, datos, min, max){
  if(!cont || !datos.length) return;
  const W = anchoGrafico(cont), H = 180, pl = 44, pr = 4, pt = 10, pb = 22, iw = W-pl-pr, ih = H-pt-pb;
  const e = escala(Math.max(max, ...datos.map(d => d.res)) * 1.05);
  const y = v => pt + ih - Math.max(0,v)/e.max*ih;
  const bw = iw/datos.length, x = i => pl + bw*i + bw/2;
  let s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Reserva de emergencia proyectada contra las metas">';
  for(let v=0; v<=e.max+1e-6; v+=e.paso) s += '<line class="grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="ax m" x="'+(pl-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+corto(v)+'</text>';
  s += '<rect x="'+pl+'" y="'+y(max)+'" width="'+iw+'" height="'+(y(min)-y(max))+'" fill="rgba(23,166,115,.08)"/>';
  [[min,'mín.'],[max,'máx.']].forEach(([v,t]) => { if(v>0) s += '<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--muted)" stroke-dasharray="4 4"/><text class="ax" x="'+(W-pr-2)+'" y="'+(y(v)-5)+'" text-anchor="end">'+t+'</text>'; });
  const pts = datos.map((d,i) => [x(i), y(d.res)]);
  s += '<path d="M'+pts[0][0]+','+y(0)+' L'+pts.map(p=>p.join(',')).join(' L')+' L'+pts[pts.length-1][0]+','+y(0)+' Z" fill="rgba(23,166,115,.14)"/>';
  s += '<polyline points="'+pts.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="var(--s3)" stroke-width="2.5" stroke-linejoin="round"/>';
  datos.forEach((d,i) => s += '<text class="ax" x="'+x(i)+'" y="'+(H-6)+'" text-anchor="middle">'+etiquetaMes(d.mes, bw)+'</text>');
  s += '<line class="base" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(0)+'" y2="'+y(0)+'"/>';
  s += '<line class="hl" x1="0" x2="0" y1="'+pt+'" y2="'+(pt+ih)+'" stroke="var(--faint)" stroke-dasharray="3 3" style="display:none"/></svg>';
  cont.querySelector('.ch-svg').innerHTML = s;
  hover(cont, datos.length, i => '<b>'+mesTexto(datos[i].mes)+'</b><div class="tr"><span>Reserva</span><span>'+$m(datos[i].res)+'</span></div><div class="tr"><span>Meses cubiertos</span><span>'+datos[i].cub+'</span></div>', {pl, iw, W});
}
// Tooltip por columna (mouse y dedo)
function hover(cont, n, html, g){
  const svg = cont.querySelector('svg'), tip = cont.querySelector('.tip'), hl = svg.querySelector('.hl');
  const mover = ev => {
    const r = svg.getBoundingClientRect();
    const x = (ev.clientX - r.left) * (g.W / r.width);
    const i = Math.max(0, Math.min(n-1, Math.floor((x - g.pl) / (g.iw/n))));
    tip.innerHTML = html(i);
    tip.classList.add('on');
    const cx = g.pl + g.iw/n*(i+.5);
    if(hl){ hl.setAttribute('x1',cx); hl.setAttribute('x2',cx); hl.style.display=''; }
    const cr = cont.getBoundingClientRect();
    let left = (cx * r.width / g.W) + (r.left - cr.left) + 12;
    if(left + tip.offsetWidth > cont.clientWidth - 4) left = left - tip.offsetWidth - 24;
    tip.style.left = Math.max(4,left)+'px';
    tip.style.top = (r.top - cr.top + 10)+'px';
  };
  const salir = () => { tip.classList.remove('on'); if(hl) hl.style.display='none'; };
  svg.addEventListener('pointermove', mover);
  svg.addEventListener('pointerdown', mover);
  svg.addEventListener('pointerleave', salir);
}

/* ── EN QUÉ SE VA LA PLATA ──────────────────────────────────────────── */
const SERIES = ['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--s6)','var(--s7)'];
function renderCategorias(){
  const t = D.categorias.tabla;
  if(!t){ $('page-categorias').innerHTML = '<div class="vacio">No se encontró la tabla de Categorías.</div>'; return; }
  const meses = t.cols.slice(1).map((c,i) => ({i:i+1, c, k: mesClave(c.n) || (c.n.match(/^\d{4}-\d{2}/)?c.n.slice(0,7):'')})).filter(x => x.k);
  const actual = mesActual();
  if(!UI.catMes || !meses.some(m => m.k===UI.catMes)) UI.catMes = (meses.find(m => m.k===actual) || meses[0] || {}).k;
  const mSel = meses.find(m => m.k===UI.catMes);
  if(!mSel){ $('page-categorias').innerHTML = '<div class="vacio">La tabla de Categorías no tiene meses.</div>'; return; }
  const esTer = n => /^adelantos a terceros/.test(norm(n));
  const cats = t.filas.map(f => ({nombre: String(f[0]), vals: f}));
  const propias = cats.filter(c => !esTer(c.nombre)), ter = cats.find(c => esTer(c.nombre));

  // Colores fijos según el tamaño en el mes actual
  const mAct = meses.find(m => m.k===actual) || mSel;
  const orden = propias.filter(c => n0(c.vals[mAct.i])>0).sort((a,b) => b.vals[mAct.i]-a.vals[mAct.i]);
  const color = {}; orden.slice(0, 7).forEach((c,i) => color[c.nombre] = SERIES[i]);
  const col = n => color[n] || 'var(--s-resto)';

  const enMes = propias.filter(c => n0(c.vals[mSel.i])>0).sort((a,b) => b.vals[mSel.i]-a.vals[mSel.i]);
  const propio = enMes.reduce((a,c) => a+c.vals[mSel.i], 0);
  const vTer = ter ? n0(ter.vals[mSel.i]) : 0;
  const maxCat = enMes.length ? enMes[0].vals[mSel.i] : 1;

  let h = avisoEstado();
  h += '<div class="titulo">En qué se va la plata</div><div class="bajada">Tarjetas y gastos fijos de cada mes, por categoría.</div>';
  h += '<div class="mnav">'+meses.map(m => '<button class="mbtn'+(m.k===UI.catMes?' active':'')+'" onclick="UI.catMes=\''+m.k+'\';UI.catSel=null;renderCategorias()">'+Mayus(mesTexto(m.k))+'</button>').join('')+'</div>';

  h += '<div class="card"><div class="lbl">Tu gasto en '+mesLargo(mSel.k)+'</div><div class="big">'+$m(propio)+'</div>'
    + (vTer>0 ? '<div class="sub m2">Además pagaste '+$m(vTer)+' por otras personas (te lo devuelven).</div>' : '')
    + apilada(enMes.map(c => ({n:c.nombre, v:c.vals[mSel.i], col:col(c.nombre)})))
    + '<div>'+enMes.map(c => {
        const v = c.vals[mSel.i], abierto = UI.catSel===c.nombre;
        return '<div class="hb'+(abierto?' sel':'')+'" data-c="'+esc(c.nombre)+'" onclick="UI.catSel=UI.catSel===this.dataset.c?null:this.dataset.c;renderCategorias()">'
          + '<div class="hh"><span><i class="sw" style="background:'+col(c.nombre)+'"></i>'+esc(c.nombre)+'</span><span><b>'+$m(v)+'</b><small>'+(propio>0?Math.round(v/propio*100):0)+'%</small></span></div>'
          + '<div class="tr"><i style="width:'+(v/maxCat*100).toFixed(1)+'%;background:'+col(c.nombre)+'"></i></div>'
          + (abierto ? detalleCategoria(c.nombre, mSel.k) : '')
          + '</div>';
      }).join('')+'</div>'
    + (enMes.length ? '<div class="sub m2" style="margin-top:10px">Tocá una categoría para ver qué incluye.</div>' : '<div class="vacio">Sin gastos cargados para este mes.</div>')
    + '</div>';

  if(ter && vTer>0){
    const abierto = UI.catSel===ter.nombre;
    h += '<div class="card"><div class="hb'+(abierto?' sel':'')+'" data-c="'+esc(ter.nombre)+'" onclick="UI.catSel=UI.catSel===this.dataset.c?null:this.dataset.c;renderCategorias()" style="border:none">'
      + '<div class="hh"><span><i class="sw" style="background:var(--s-resto)"></i>Pagado por otros</span><span><b>'+$m(vTer)+'</b></span></div>'
      + (abierto ? detalleCategoria(ter.nombre, mSel.k) : '<div class="sub m2" style="margin-top:4px">Cuotas a cargo de Mamá, Pau, Bruno y otros. Tocá para ver.</div>')
      + '</div></div>';
  }

  // Próximos meses
  h += secT('Cómo vienen los próximos meses')
    + '<div class="card"><div class="chart" id="ch-apil"><div class="leg">'
    + orden.slice(0,7).map(c => '<span><i style="background:'+col(c.nombre)+'"></i>'+esc(c.nombre)+'</span>').join('')
    + (propias.length>7 ? '<span><i style="background:var(--s-resto)"></i>Resto</span>' : '')
    + '</div><div class="ch-svg"></div><div class="tip"></div></div>'
    + '<div class="sub m2" style="margin-top:8px">Tocá una barra para ver ese mes. No incluye lo que pagás por otros.</div></div>';

  $('page-categorias').innerHTML = h;
  apiladas($('ch-apil'), meses, propias, color, col);
}
function apiladas(cont, meses, cats, color, col){
  const W = anchoGrafico(cont), H = 200, pl = 44, pr = 4, pt = 8, pb = 22, iw = W-pl-pr, ih = H-pt-pb;
  const datos = meses.map(m => {
    const partes = []; let resto = 0;
    cats.forEach(c => { const v = c.vals[m.i]; if(typeof v!=='number' || v<=0) return; if(color[c.nombre]) partes.push({n:c.nombre, v, col:col(c.nombre)}); else resto += v; });
    partes.sort((a,b) => Object.keys(color).indexOf(a.n) - Object.keys(color).indexOf(b.n));
    if(resto>0) partes.push({n:'Resto', v:resto, col:'var(--s-resto)'});
    return {m, partes, suma: partes.reduce((a,p)=>a+p.v,0)};
  });
  const e = escala(Math.max(...datos.map(d=>d.suma), 1));
  const y = v => pt + ih - v/e.max*ih;
  const bw = iw/datos.length, barW = Math.min(40, bw*0.55);
  let s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gastos por categoría y mes">';
  for(let v=0; v<=e.max+1e-6; v+=e.paso) s += '<line class="grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="ax m" x="'+(pl-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+corto(v)+'</text>';
  datos.forEach((d,i) => {
    const x = pl + bw*i + (bw-barW)/2; let acc = 0;
    d.partes.forEach((p,j) => {
      const y1 = y(acc+p.v), y0 = y(acc), h = Math.max(0, y0-y1-(j>0?1.5:0));
      s += '<rect x="'+x+'" y="'+y1+'" width="'+barW+'" height="'+h+'" fill="'+p.col+'"'+(j===d.partes.length-1?' rx="3"':'')+'/>';
      acc += p.v;
    });
    s += '<text class="ax" x="'+(x+barW/2)+'" y="'+(H-6)+'" text-anchor="middle"'+(d.m.k===UI.catMes?' style="fill:var(--ink);font-weight:700"':'')+'>'+MESES[+d.m.k.slice(5,7)-1]+'</text>';
  });
  s += '<line class="base" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(0)+'" y2="'+y(0)+'"/>';
  s += '<line class="hl" x1="0" x2="0" y1="'+pt+'" y2="'+(pt+ih)+'" stroke="none"/></svg>';
  cont.querySelector('.ch-svg').innerHTML = s;
  hover(cont, datos.length, i => '<b>'+mesTexto(datos[i].m.k)+' · '+$m(datos[i].suma)+'</b>'+datos[i].partes.slice().reverse().map(p => '<div class="tr"><span><i style="background:'+p.col+'"></i>'+esc(p.n)+'</span><span>'+$m(p.v)+'</span></div>').join(''), {pl, iw, W});
  cont.querySelector('svg').addEventListener('click', ev => {
    const r = ev.currentTarget.getBoundingClientRect();
    const i = Math.floor(((ev.clientX - r.left) * (W / r.width) - pl)/bw);
    if(datos[i]){ UI.catMes = datos[i].m.k; UI.catSel = null; renderCategorias(); window.scrollTo({top:0, behavior:'smooth'}); }
  });
}
// Movimientos y gastos fijos de una categoría en un mes (filtrado, sin sumar)
function detalleCategoria(cat, mes){
  const terceros = /^adelantos a terceros/.test(norm(cat));
  const enRango = (desde, hasta) => { const a = mesClave(desde), b = mesClave(hasta); return a && a<=mes && (!b || mes<=b); };
  const esPropio = r => { const q = norm(r.v('A cargo de')); return !q || q==='propio'; };
  const mov = filas(D.movimientos).filter(r =>
    (terceros ? !esPropio(r) : esPropio(r) && norm(r.v('Categoría'))===norm(cat)) && enRango(r.v('Primer resumen'), r.v('Último resumen')));
  const fij = filas(D.fijos).filter(r =>
    (terceros ? !esPropio(r) : esPropio(r) && norm(r.v('Categoría'))===norm(cat)) && enRango(r.v('Desde'), r.v('Hasta (calculado)') || r.v('Hasta')));
  if(!mov.length && !fij.length) return '<div class="det2"><div class="sub m2">Sin detalle para '+mesTexto(mes)+'.</div></div>';
  return '<div class="det2" onclick="event.stopPropagation()">'
    + fij.map(r => '<div class="kv"><span>'+esc(r.v('Concepto'))+' <small>· fijo'+(terceros?' · '+esc(r.v('A cargo de')):'')+'</small></span><span>'+r.f('Monto mensual')+'</span></div>').join('')
    + mov.map(r => '<div class="kv"><span>'+esc(r.v('Concepto'))+' <small>· '+esc(r.v('Tarjeta'))+(terceros?' · '+esc(r.v('A cargo de')):'')+(norm(r.v('Estimado'))==='si'?' · estimado':'')+'</small></span><span>'+r.f('Cuota con recargo')+'</span></div>').join('')
    + '</div>';
}

/* ── TARJETAS ───────────────────────────────────────────────────────── */
function renderTarjetas(){
  const F = filas(D.resumenes);
  const meses = [...new Set(F.map(r => mesClave(r.v('Mes'))).filter(Boolean))].sort();
  const actual = mesActual();
  if(!UI.tarMes || !meses.includes(UI.tarMes)) UI.tarMes = meses.includes(mesSumar(actual||'2000-01',1)) ? mesSumar(actual,1) : (meses.includes(actual) ? actual : meses[0]);
  const sel = F.filter(r => mesClave(r.v('Mes'))===UI.tarMes);
  const pf = filas(D.panel.tabla).find(r => mesClave(r.v('Mes'))===UI.tarMes);
  const tot = pf ? n0(pf.v('Total a pagar')) : sel.reduce((a,r)=>a+n0(r.v('Total del resumen')),0);
  const cub = pf ? n0(pf.v('Pagado o reservado')) : 0, falta = pf ? n0(pf.v('Falta cubrir')) : 0;

  const conFalta = sel.filter(r => n0(r.v('Falta'))>0.5).sort((a,b) => n0(b.v('Falta'))-n0(a.v('Falta')));
  const listas = sel.filter(r => !(n0(r.v('Falta'))>0.5) && !norm(r.v('Estado')).startsWith('sin'));
  const sinCons = sel.filter(r => norm(r.v('Estado')).startsWith('sin'));

  let h = avisoEstado();
  h += '<div class="titulo">Tarjetas y fijos</div><div class="bajada">Qué hay que pagar cada mes y cuánto ya está pagado o reservado.</div>';
  h += '<div class="mnav">'+meses.map(m => '<button class="mbtn'+(m===UI.tarMes?' active':'')+'" onclick="UI.tarMes=\''+m+'\';renderTarjetas()">'+Mayus(mesTexto(m))+'</button>').join('')+'</div>';

  h += '<div class="card"><div class="lbl">A pagar en '+mesLargo(UI.tarMes)+'</div><div class="big">'+$m(tot)+'</div>'
    + prog(cub, tot)
    + '<div class="sub">'+(falta>CUBIERTO ? 'Cubierto <b>'+$m(cub)+'</b> · falta <b class="neg">'+$m(falta)+'</b>' : '<span class="pos"><b>Todo cubierto</b></span>')+'</div>'
    + (pf && n0(pf.v('A cargo de terceros'))>0 ? '<div class="sub m2" style="margin-top:4px">Incluye '+pf.f('A cargo de terceros')+' que pagás por otras personas.</div>' : '')
    + '</div>';

  const fila = r => {
    const f = n0(r.v('Falta')), e = norm(r.v('Estado'));
    const ic = f>0.5 ? (e.startsWith('pendiente')?'bad':'warn') : 'ok';
    const partes = [];
    if(n0(r.v('Pagado'))) partes.push('pagado '+r.f('Pagado'));
    if(n0(r.v('Reservado'))) partes.push('reservado '+r.f('Reservado'));
    return '<div class="li" style="align-items:flex-start"><div class="ic '+ic+'">'+(ic==='ok'?IC.ok:IC.warn)+'</div><div class="lm"><div class="lt">'+esc(r.v('Tarjeta o medio'))+'</div>'
      + '<div class="ls">'+(f>0.5 ? esc(r.v('Estado'))+(partes.length?' · ':'') : '')+partes.join(' · ')+'</div>'
      + (r.v('Notas') ? '<div class="ls">'+esc(r.v('Notas'))+'</div>' : '')+'</div>'
      + '<div class="lv">'+r.f('Total del resumen')+(f>0.5?'<small class="neg">falta '+r.f('Falta')+'</small>':'')+'</div></div>';
  };
  if(conFalta.length) h += secT('Falta cubrir') + '<div class="card" style="padding:6px 16px"><div class="lst">'+conFalta.map(fila).join('')+'</div></div>';
  if(listas.length) h += secT('Cubiertas') + '<div class="card" style="padding:6px 16px"><div class="lst">'+listas.map(fila).join('')+'</div></div>';
  if(sinCons.length) h += '<div class="sub m2" style="margin:6px 2px">Sin consumos: '+sinCons.map(r => esc(r.v('Tarjeta o medio'))).join(', ')+'.</div>';
  if(!sel.length) h += '<div class="vacio">Sin resúmenes para este mes.</div>';
  $('page-tarjetas').innerHTML = h;
}

/* ── AHORRO E INVERSIÓN + TERCEROS ──────────────────────────────────── */
function renderAhorro(){
  const P = D.panel.indicadores, R = D.proyeccion.recomendacion;
  const inv = ind(P,'invertido este mes','E6'), plan = ind(R,'invertir este mes');
  const cUsd = ind(P,'cartera en el broker \\(usd','E9'), cArs = ind(P,'cartera en el broker \\(ars','E10');
  const pctObj = ind(D.config.indicadores, 'inversion');
  const mes = mesActual();

  let h = avisoEstado();
  h += '<div class="titulo">Ahorro e inversión</div><div class="bajada">Tu colchón, lo que invertís y lo que te deben.</div>';
  h += seccionReserva(false);

  // Inversión del mes
  const vInv = nv(inv), vPlan = nv(plan);
  h += '<div class="card"><div class="card-t">Inversión de '+mesLargo(mes)+'</div>'
    + '<div class="big">'+fi(inv,'$ 0')+' <span class="lbl" style="font-size:15px;font-weight:400">de '+$m(vPlan)+'</span></div>'
    + prog(vInv, vPlan, '')
    + '<div class="sub">'+(vPlan-vInv>CUBIERTO ? 'Te falta invertir <b>'+$m(vPlan-vInv)+'</b>' : '<span class="pos"><b>Objetivo cumplido</b></span>')+(pctObj?' · objetivo: '+fi(pctObj)+' de lo que cobrás':'')+'</div>';
  const invMes = filas(D.inversiones).filter(r => mesClave(r.v('Mes'))===mes || mesClave(r.v('Fecha'))===mes);
  if(invMes.length) h += '<div class="lst" style="margin-top:8px">'+invMes.map(r => '<div class="li"><div class="lm"><div class="lt">'+esc(r.v('Instrumento'))+'</div><div class="ls">'+r.f('Fecha')+'</div></div><div class="lv">'+r.f('Monto en ARS')+'</div></div>').join('')+'</div>';
  h += '</div>';

  // Cartera
  const ct = D.cartera, tipos = filas(D.carteraPorTipo);
  const iValUsd = ci(D.carteraPorTipo,'Valor');
  const totTipos = tipos.reduce((a,r) => a+n0(r.raw[iValUsd]), 0) || 1;
  const fmtUsd = v => fmt(v, 'usd', 0, '-');
  h += '<div id="cartera"></div>' + secT('Cartera en el broker')
    + '<div class="card"><div class="big">'+fi(cUsd,'-')+'</div><div class="sub m2">'+fi(cArs,'-')+' al dólar MEP</div>'
    + apilada(tipos.map((r,i) => ({n:r.raw[0], v:n0(r.raw[iValUsd]), col:SERIES[i%SERIES.length]})))
    + '<div class="lst">'+tipos.map((r,i) => '<div class="li"><i class="sw" style="background:'+SERIES[i%SERIES.length]+'"></i><div class="lm"><div class="lt">'+esc(r.raw[0])+'</div></div><div class="lv">'+fmtUsd(n0(r.raw[iValUsd]))+'<small>'+Math.round(n0(r.raw[iValUsd])/totTipos*100)+'%</small></div></div>').join('')+'</div>'
    + (ct ? '<details class="mas"><summary>Ver los '+ct.filas.length+' instrumentos</summary><div class="lst">'+filas(ct).map(r => {
        const rend = n0(r.v('Rendimiento'));
        return '<div class="li"><div class="lm"><div class="lt">'+esc(r.v('Instrumento'))+'</div><div class="ls">'+esc(r.v('Tipo'))+'</div></div><div class="lv">'+r.f('Valor (USD)')+'<small class="'+(rend>0?'pos':rend<0?'neg':'')+'">'+(rend>0?'+':'')+(rend?fmtUsd(rend):'±0')+'</small></div></div>';
      }).join('')+'</div></details>' : '')
    + '</div>';

  // Reservas para pagos, por mes
  const act = filas(D.reservas).filter(r => norm(r.v('Estado'))==='activa');
  const porMes = {};
  act.forEach(r => { const k = mesClave(r.v('Mes del pago')) || '—'; (porMes[k] = porMes[k] || []).push(r); });
  h += secT('Plata apartada para pagar') + '<div class="card" style="padding:4px 16px">'
    + (act.length ? Object.keys(porMes).sort().map(k => {
        const rs = porMes[k], suma = rs.reduce((a,r) => a+n0(r.v('Monto en ARS')), 0);
        return '<details class="mes"><summary><div class="lm" style="flex:1"><div class="lt" style="font-weight:600">Para '+(k==='—'?'sin mes':mesTexto(k))+'</div><div class="ls">'+rs.length+' frascos · '+esc([...new Set(rs.map(r => r.v('Lugar o instrumento')))].join(', '))+'</div></div><div class="lv">'+$m(suma)+'</div></summary><div class="det">'
          + rs.map(r => '<div class="kv"><span>'+esc(r.v('Concepto')==='Resumen'||r.v('Concepto')==='Cuotas' ? r.v('Tarjeta o medio') : r.v('Concepto'))+' <small class="muted">'+(r.v('Vencimiento')?'· vence '+fechaCorta(r.v('Vencimiento')):'· disponible')+'</small></span><span>'+r.f('Monto en ARS')+'</span></div>').join('')
          + '</div></details>';
      }).join('') : '<div class="vacio">No hay reservas activas.</div>')
    + '</div>';

  // Terceros
  const tt = D.terceros, T = filas(tt).filter(r => r.v('Persona') && n0(r.v('Saldo a cobrar')));
  const iSaldo = ci(tt,'Saldo a cobrar');
  h += '<div id="terceros"></div>' + secT('Te deben')
    + '<div class="card">'+(tt.total && iSaldo>=0 ? '<div class="big">'+fmt(tt.total[iSaldo], tt.cols[iSaldo].k, 0)+'</div>' : '')
    + '<div class="lst">'+T.map(r => {
        const ini = n0(r.v('Saldo inicial')), ad = n0(r.v('Adelantado')), pag = n0(r.v('Pagos recibidos'));
        const det = [];
        if(ini) det.push('deuda inicial '+$m(ini));
        if(ad) det.push('le adelantaste '+$m(ad));
        if(pag) det.push('te pagó '+$m(pag));
        return '<div class="li"><div class="lm"><div class="lt">'+esc(r.v('Persona'))+'</div>'+(det.length?'<div class="ls">'+det.join(' · ')+'</div>':'')+'</div><div class="lv">'+$m(r.v('Saldo a cobrar'))+'</div></div>';
      }).join('')+'</div>'
    + (tt.notas && tt.notas.length ? '<div class="sub m2" style="margin-top:8px">'+tt.notas.map(esc).join('<br>')+'</div>' : '')
    + '</div>';
  const pagos = filas(D.pagosTerceros).slice(-8).reverse();
  if(pagos.length) h += '<div class="card"><div class="card-t">Últimos pagos recibidos</div><div class="lst">'+pagos.map(r => '<div class="li"><div class="lm"><div class="lt">'+esc(r.v('Persona'))+'</div><div class="ls">'+r.f('Fecha')+(r.v('Concepto')?' · '+esc(r.v('Concepto')):'')+'</div></div><div class="lv pos">'+r.f('Monto')+'</div></div>').join('')+'</div></div>';

  $('page-ahorro').innerHTML = h;
}

/* ── Navegación ─────────────────────────────────────────────────────── */
const PAGINAS = {hoy:()=>renderHoy(), proyeccion:()=>renderProyeccion(), categorias:()=>renderCategorias(), tarjetas:()=>renderTarjetas(), ahorro:()=>renderAhorro()};

  actualP = p;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.p===p));

function irA(p, ancla, mes){

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { mostrar(t.dataset.p); window.scrollTo({top:0}); }));

/* ── Privacidad ─────────────────────────────────────────────────────── */
function setPriv(on){
  document.body.classList.toggle('priv', on);
  $('b-priv').classList.toggle('on', on);
  $('b-priv').title = on ? 'Mostrar montos' : 'Ocultar montos';

$('b-priv').addEventListener('click', () => setPriv(!document.body.classList.contains('priv')));

/* ── Toast ──────────────────────────────────────────────────────────── */
let toastT;
function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

/* ── Configuración ──────────────────────────────────────────────────── */
function abrirConfig(){
  $('c-url').value = ls.get(K.url) || '';
  $('c-token').value = ls.get(K.token) || '';
  $('c-err').style.display = 'none';
  $('c-cancel').style.display = D ? '' : 'none';
  $('m-config').classList.add('on');
}
function cerrarConfig(){ $('m-config').classList.remove('on'); }
$('b-config').addEventListener('click', abrirConfig);
$('c-cancel').addEventListener('click', cerrarConfig);
$('c-save').addEventListener('click', async () => {
  const u = $('c-url').value.trim(), t = $('c-token').value.trim();
  const err = m => { $('c-err').textContent = m; $('c-err').style.display = ''; };
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(u)) return err('La URL tiene que ser la de la aplicación web de Apps Script (https://script.google.com/macros/s/…/exec).');
  if(!t) return err('Falta el token.');
  $('c-save').disabled = true; $('c-save').textContent = 'Probando…';
  try{
    const j = await pedir(u + (u.includes('?')?'&':'?') + 'token=' + encodeURIComponent(t));
    ls.set(K.url, u); ls.set(K.token, t);
    D = j; D_AT = new Date(); OFFLINE = false; ERROR = '';
    ls.set(K.cache, JSON.stringify({at:D_AT.toISOString(), d:j}));
    cerrarConfig(); render(); toast('Conectado a '+(j.planilla||'la planilla'));
  } catch(e){
    err(e.status===403 ? 'El token no coincide con el del Apps Script.' : e.message);
  } finally { $('c-save').disabled = false; $('c-save').textContent = 'Probar y guardar'; }
});
$('c-pin').addEventListener('click', () => { cerrarConfig(); pinNuevo(); });
$('c-lock').addEventListener('click', () => { cerrarConfig(); bloquear(); });
$('c-clear').addEventListener('click', () => {
  if(!confirm('Se borran la URL, el token, el PIN y los datos guardados en este dispositivo. La planilla no se toca.')) return;
  [K.url, K.token, K.pin, K.cache, K.priv, K.tab].forEach(ls.del);
  location.reload();
});
$('b-refresh').addEventListener('click', () => cargar(true));

/* ── Tirar para refrescar ───────────────────────────────────────────── */
(function(){
  let y0 = null, dy = 0;
  window.addEventListener('touchstart', e => { y0 = (window.scrollY<=0 && !document.querySelector('.modal-bg.on,.lock.on')) ? e.touches[0].clientY : null; dy = 0; }, {passive:true});
  window.addEventListener('touchmove', e => { if(y0==null) return; dy = e.touches[0].clientY - y0; $('ptr').classList.toggle('on', dy > 80); }, {passive:true});
  window.addEventListener('touchend', () => { if(y0!=null && dy > 80) cargar(true); y0 = null; $('ptr').classList.remove('on'); });
})();

/* ── PIN ────────────────────────────────────────────────────────────── */
async function hashPin(pin){
  const txt = 'misfinanzas:' + pin;
  if(window.crypto && crypto.subtle){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
  }
  let h = 5381; for(let i=0; i<txt.length; i++) h = ((h<<5)+h+txt.charCodeAt(i))|0;
  return 'd'+(h>>>0).toString(16);
}
const LOCK = {modo:'abrir', buf:'', primero:'', alAbrir:null};
function armarPad(){
  const keys = ['1','2','3','4','5','6','7','8','9','',  '0','borrar'];
  $('pad').innerHTML = keys.map(k => k==='' ? '<span></span>' : '<button'+(k==='borrar'?' class="nb"':'')+' data-k="'+k+'">'+k+'</button>').join('');
  $('pad').addEventListener('click', e => { const b = e.target.closest('button'); if(b) tecla(b.dataset.k); });
  document.addEventListener('keydown', e => {
    if(!$('lock').classList.contains('on')) return;
    if(/^\d$/.test(e.key)) tecla(e.key); else if(e.key==='Backspace') tecla('borrar');
  });
}
function pintarPuntos(){ [...$('pdots').children].forEach((d,i) => d.classList.toggle('f', i<LOCK.buf.length)); }
function msgLock(m, err){ $('lock-msg').textContent = m; $('lock-msg').classList.toggle('err', !!err); }
async function tecla(k){
  if(k==='borrar'){ LOCK.buf = LOCK.buf.slice(0,-1); pintarPuntos(); return; }
  if(LOCK.buf.length>=4) return;
  LOCK.buf += k; pintarPuntos();
  if(LOCK.buf.length<4) return;
  const pin = LOCK.buf;
  await new Promise(r => setTimeout(r, 120));
  LOCK.buf = ''; pintarPuntos();
  if(LOCK.modo==='abrir'){
    if(await hashPin(pin) === ls.get(K.pin)) desbloquear();
    else { sacudir(); msgLock('PIN incorrecto', true); }
  } else if(LOCK.modo==='nuevo'){
    LOCK.primero = pin; LOCK.modo = 'confirmar'; msgLock('Repetí el PIN');
  } else if(LOCK.modo==='confirmar'){
    if(pin===LOCK.primero){ ls.set(K.pin, await hashPin(pin)); toast('PIN guardado'); desbloquear(); }
    else { sacudir(); LOCK.modo = 'nuevo'; msgLock('No coinciden. Elegí un PIN de 4 dígitos', true); }
  }
}
function sacudir(){ const p = $('pdots'); p.classList.remove('shake'); void p.offsetWidth; p.classList.add('shake'); }
function bloquear(){ LOCK.modo = 'abrir'; LOCK.buf = ''; pintarPuntos(); msgLock('Ingresá tu PIN'); $('lock').classList.add('on'); }
function pinNuevo(){ LOCK.modo = 'nuevo'; LOCK.buf = ''; pintarPuntos(); msgLock('Elegí un PIN de 4 dígitos'); $('lock').classList.add('on'); }
function desbloquear(){
  $('lock').classList.remove('on');
  const fn = LOCK.alAbrir; LOCK.alAbrir = null; if(fn) fn();
}
// Se vuelve a bloquear si la app estuvo más de 2 minutos en segundo plano
let oculto = 0;
document.addEventListener('visibilitychange', () => {
  if(document.hidden){ oculto = Date.now(); return; }
  if(ls.get(K.pin) && oculto && Date.now()-oculto > 120000) bloquear();
  if(D_AT && Date.now()-D_AT > 5*60000) cargar(false);
  pintarActualizado();
});

/* ── Inicio ─────────────────────────────────────────────────────────── */
(function iniciar(){
  armarPad();
  setPriv(ls.get(K.priv)==='1');
  const tab = ls.get(K.tab); if(tab && $('page-'+tab)) mostrar(tab);
  leerCache();
  const seguir = () => { render(); cargar(false); };
  if(ls.get(K.pin)){ LOCK.alAbrir = seguir; bloquear(); }
  else { LOCK.alAbrir = seguir; pinNuevo(); }
  setInterval(pintarActualizado, 60000);
})();
