<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f2ec">
<meta name="robots" content="noindex">
<title>mis finanzas</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0e0e0e;--paper:#f5f2ec;--cream:#ede9e0;--card:#ffffff;
  --gold:#c9a84c;--gold-l:#f0d98a;--gold-d:rgba(201,168,76,.12);--gold-t:#8a6520;
  --red:#c0392b;--red-d:rgba(192,57,43,.09);
  --green:#2d6a4f;--green-d:rgba(45,106,79,.09);
  --blue:#1a4a7a;--blue-d:rgba(26,74,122,.09);
  --purple:#6b3fa0;--purple-d:rgba(107,63,160,.09);
  --muted:#8a8478;--muted2:#b5b0a5;
  --border:rgba(14,14,14,.09);--border2:rgba(14,14,14,.05);
  --sh:0 1px 3px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.03);
  /* Series de gráficos (paleta categórica validada, orden fijo) */
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--s8:#e34948;--s-resto:#b5b0a5;
  --nav-h:0px;--tab-h:58px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:'Geist Mono',monospace;font-size:12.5px;min-height:100vh;overscroll-behavior-y:contain}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.02;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
button{font-family:inherit;color:inherit}

/* NAV */
.nav{position:sticky;top:0;z-index:200;background:rgba(245,242,236,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1.5px solid var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 24px;padding-top:env(safe-area-inset-top)}
.nav-l{display:flex;align-items:center;min-width:0}
.nav-title{font-family:'Instrument Serif',serif;font-size:17px;padding:12px 16px 12px 0;margin-right:12px;border-right:1px solid var(--border);white-space:nowrap;flex-shrink:0}
.nav-title em{font-style:italic;color:var(--gold)}
.tabs{display:flex}
.tab{padding:13px 13px;font-size:10px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1.5px;transition:color .15s,border-color .15s;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:6px}
.tab svg{display:none}
.tab:hover{color:var(--ink)}.tab.active{color:var(--ink);border-bottom-color:var(--ink)}
.nav-r{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-left:8px}
.upd{font-size:9.5px;color:var(--muted);white-space:nowrap}
.upd.viejo{color:var(--red)}
.ibtn{background:transparent;border:1.5px solid var(--border);border-radius:16px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .15s,background .15s;flex-shrink:0}
.ibtn:hover{border-color:var(--ink)}
.ibtn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ibtn svg{width:15px;height:15px}
.ibtn.girando svg{animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

.btn{background:var(--ink);color:white;border:none;border-radius:4px;padding:9px 14px;font-size:11px;cursor:pointer;white-space:nowrap;transition:opacity .15s}
.btn:hover{opacity:.85}.btn:disabled{opacity:.4;cursor:default}
.btn-o{background:transparent;color:var(--ink);border:1.5px solid var(--ink);border-radius:4px;padding:8px 12px;font-size:11px;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-o:hover{background:var(--ink);color:white}

.page{display:none;position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:24px 20px 80px}
.page.active{display:block;animation:fi .2s ease}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sec{margin-bottom:26px}
.sh{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.sh h2{font-family:'Instrument Serif',serif;font-size:19px;font-weight:400;letter-spacing:-.3px;white-space:nowrap}
.sh .sr{flex:1;height:1px;background:var(--border)}
.sh .ss{font-size:10px;color:var(--muted);white-space:nowrap}
.lead{font-size:10.5px;color:var(--muted);margin:-4px 0 12px;line-height:1.55}

.g{display:grid;gap:9px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:13px 15px;box-shadow:var(--sh);min-width:0}
.card .cl{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;line-height:1.35}
.card .cv{font-family:'Instrument Serif',serif;font-size:22px;line-height:1.05;margin-bottom:3px;overflow-wrap:anywhere}
.card .cs{font-size:10px;color:var(--muted);line-height:1.45}
.card.dk{background:var(--ink);color:white;border-color:var(--ink)}
.card.dk .cl{color:rgba(255,255,255,.5)}.card.dk .cv{color:var(--gold-l)}.card.dk .cs{color:rgba(255,255,255,.55)}
.card.gl{border-left:3px solid var(--green)}.card.rl{border-left:3px solid var(--red)}
.card.al{border-left:3px solid var(--gold)}.card.bl{border-left:3px solid var(--blue)}
.card.link{cursor:pointer}.card.link:hover{border-color:var(--muted2)}

.hero{background:var(--ink);color:white;border-radius:9px;padding:18px 18px 16px;box-shadow:0 8px 28px rgba(0,0,0,.12)}
.hero .hl{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:8px}
.hero .hv{font-family:'Instrument Serif',serif;font-size:40px;line-height:1;color:var(--gold-l);margin-bottom:12px}
.hero .hrows{display:flex;flex-direction:column;gap:5px;border-top:1px solid rgba(255,255,255,.12);padding-top:10px}
.hero .hr{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:rgba(255,255,255,.75)}
.hero .hr b{color:white;font-weight:500;white-space:nowrap}
.hero .hnote{font-size:10px;color:rgba(255,255,255,.45);margin-top:10px;line-height:1.5}

.tw{background:var(--card);border:1px solid var(--border);border-radius:7px;overflow:hidden;box-shadow:var(--sh)}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse}
th{padding:7px 10px;text-align:left;font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:500;border-bottom:1px solid var(--border);background:var(--cream);white-space:nowrap}
th.r,td.r{text-align:right}
td{padding:8px 10px;border-bottom:1px solid var(--border2);font-size:11px;vertical-align:middle}
td.r{white-space:nowrap}
tr:last-child td{border-bottom:none}
tr.tot td{background:var(--cream);font-weight:600;border-top:1.5px solid var(--border)}
tr.marca td{background:var(--gold-d)}
td.sticky,th.sticky{position:sticky;left:0;background:inherit;z-index:1;white-space:nowrap}
tbody tr{background:var(--card)}
.muted{color:var(--muted)}
.pos{color:var(--green)}.neg{color:var(--red)}

/* Lista (filas tipo tarjeta, cómodas en el celular) */
.lst{background:var(--card);border:1px solid var(--border);border-radius:7px;box-shadow:var(--sh);overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border2)}
.li:last-child{border-bottom:none}
.li .lm{flex:1;min-width:0}
.li .lt{font-size:12px;overflow:hidden;text-overflow:ellipsis}
.li .ls{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.45}
.li .lv{text-align:right;white-space:nowrap;font-size:12px;font-weight:500}
.li .lv small{display:block;font-size:9.5px;color:var(--muted);font-weight:400;margin-top:2px}
.li.click{cursor:pointer}.li.click:hover{background:#fafaf8}
.li.tot{background:var(--cream);font-weight:600}
.li.sel{background:var(--gold-d)}
.vacio{padding:22px 14px;text-align:center;color:var(--muted);font-size:11px}

.bdg{display:inline-block;padding:2px 7px;border-radius:2px;font-size:9px;letter-spacing:.5px;white-space:nowrap}
.e-pagado{background:var(--green-d);color:var(--green)}
.e-reservado{background:var(--blue-d);color:var(--blue)}
.e-parcial{background:var(--gold-d);color:var(--gold-t)}
.e-pendiente{background:var(--red-d);color:var(--red)}
.e-revisar{background:var(--purple-d);color:var(--purple)}
.e-sin{background:var(--cream);color:var(--muted)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px;background:currentColor}

/* Chips de mes */
.mnav{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.mnav::-webkit-scrollbar{display:none}
.mbtn{padding:6px 12px;border:1.5px solid var(--border);border-radius:16px;background:var(--card);font-size:10.5px;cursor:pointer;transition:all .15s;color:var(--muted);white-space:nowrap;flex-shrink:0}
.mbtn:hover{border-color:var(--muted2);color:var(--ink)}
.mbtn.active{background:var(--ink);color:white;border-color:var(--ink)}

/* Barras de progreso */
.prog{height:8px;background:var(--cream);border-radius:4px;overflow:hidden;margin:9px 0 6px}
.prog i{display:block;height:100%;background:var(--green);border-radius:4px}

/* Gráficos */
.chart{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:14px 14px 10px;box-shadow:var(--sh);position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{font-size:10px;fill:var(--muted);font-family:'Geist Mono',monospace}
.chart .grid{stroke:var(--border2);stroke-width:1}
.chart .base{stroke:var(--border);stroke-width:1}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:10px;color:var(--muted);margin-bottom:10px}
.leg span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.leg i{display:inline-block;width:9px;height:9px;border-radius:2px}
.leg i.ln{height:2px;width:14px;border-radius:1px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:white;border-radius:5px;padding:8px 10px;font-size:10.5px;line-height:1.55;box-shadow:0 6px 20px rgba(0,0,0,.18);opacity:0;transition:opacity .1s;z-index:5;min-width:150px}
.tip.on{opacity:1}
.tip b{font-weight:500;color:var(--gold-l);display:block;margin-bottom:2px}
.tip .tr{display:flex;justify-content:space-between;gap:14px}
.tip .tr i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.metas{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}

.donut-w{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut-w svg{width:190px;height:190px;flex-shrink:0;margin:0 auto}
.donut-w .dl{flex:1;min-width:200px}

/* Detalle de categoría */
.det{background:var(--paper);padding:4px 14px 10px 30px;border-bottom:1px solid var(--border2)}
.det .di{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--border);font-size:11px}
.det .di:last-child{border-bottom:none}
.det .di span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
.det .di small{color:var(--muted);font-size:9.5px}
.det .dn{font-size:9.5px;color:var(--muted);padding:6px 0 0;line-height:1.45}

/* Avisos */
.aviso{background:var(--gold-d);border:1px solid rgba(201,168,76,.3);border-radius:6px;padding:9px 12px;font-size:10.5px;color:#7a5e1a;margin-bottom:14px;line-height:1.5}
.aviso.err{background:var(--red-d);border-color:rgba(192,57,43,.25);color:var(--red)}
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 56px);transform:translate(-50%,-20px);opacity:0;z-index:150;background:var(--ink);color:white;border-radius:16px;padding:6px 14px;font-size:10.5px;transition:transform .2s,opacity .2s;pointer-events:none}
.ptr.on{transform:translate(-50%,0);opacity:1}

/* Privacidad: oculta montos */
.m{transition:filter .2s}
body.priv .m{filter:blur(7px);user-select:none}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(14,14,14,.5);z-index:500;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:16px}
.modal-bg.on{display:flex}
.modal{background:var(--card);border-radius:10px;padding:22px;width:460px;max-width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h3{font-family:'Instrument Serif',serif;font-size:21px;font-weight:400;margin-bottom:6px}
.modal p{font-size:10.5px;color:var(--muted);line-height:1.55;margin-bottom:14px}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fg label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.fg input{border:none;border-bottom:1.5px solid var(--muted2);background:transparent;font-family:'Geist Mono',monospace;font-size:13px;outline:none;color:var(--ink);padding:5px 0;width:100%}
.fg input:focus{border-color:var(--gold)}
.mbt{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.mlink{background:none;border:none;color:var(--muted);font-size:10.5px;text-decoration:underline;cursor:pointer;padding:6px 0}
.msep{height:1px;background:var(--border);margin:18px 0 14px}

/* Bloqueo con PIN */
.lock{position:fixed;inset:0;z-index:1000;background:var(--paper);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:22px}
.lock.on{display:flex}
.lock h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:30px}
.lock h1 em{color:var(--gold)}
.lock .lmsg{font-size:11px;color:var(--muted);min-height:16px;text-align:center}
.lock .lmsg.err{color:var(--red)}
.pdots{display:flex;gap:14px}
.pdots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ink)}
.pdots i.f{background:var(--ink)}
.pdots.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pad button{height:72px;border-radius:50%;border:1.5px solid var(--border);background:var(--card);font-size:22px;font-family:'Instrument Serif',serif;cursor:pointer;transition:background .1s}
.pad button:active{background:var(--cream)}
.pad button.nb{border:none;background:none;font-family:'Geist Mono',monospace;font-size:11px;color:var(--muted)}

.toast{position:fixed;bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,8px);z-index:9999;background:var(--ink);color:white;padding:9px 16px;border-radius:5px;font-size:11.5px;opacity:0;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(min-width:681px){
  .toast{bottom:22px}
}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}.nav{padding:0 12px}}
@media(max-width:680px){
  body{font-size:12px}
  /* Sin backdrop-filter: si no, la barra fija de pestañas queda atrapada dentro del nav */
  .nav{padding:0 12px;padding-top:env(safe-area-inset-top);backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--paper)}
  .nav-title{border-right:none;margin-right:0;padding:12px 0}
  .upd{font-size:9px}
  /* Pestañas abajo, al alcance del pulgar */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:300;background:rgba(245,242,236,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1.5px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
  .tab{flex:1;flex-direction:column;gap:3px;padding:8px 2px 9px;font-size:8.5px;letter-spacing:.4px;border-bottom:none;border-top:2px solid transparent;margin:-1.5px 0 0;min-height:var(--tab-h);justify-content:center}
  .tab.active{border-top-color:var(--ink)}
  .tab svg{display:block;width:18px;height:18px}
  .page{padding:16px 16px calc(var(--tab-h) + 40px + env(safe-area-inset-bottom))}
  .g2,.g3,.g4{grid-template-columns:1fr 1fr}
  .card{padding:12px 12px}
  .card .cv{font-size:19px}
  .card .cl{font-size:8.5px;letter-spacing:.8px}
  .hero .hv{font-size:34px}
  .sh h2{font-size:17px}
  th,td{padding:7px 8px}
  .metas{grid-template-columns:1fr 1fr}
}
@media(max-width:360px){.card .cv{font-size:17px}.pad{grid-template-columns:repeat(3,64px)}.pad button{height:64px}}
@media print{.nav,.tabs,.modal-bg,.toast,.lock{display:none!important}.page{display:block!important;padding:0}}
</style>
</head>
<body>

<!-- BLOQUEO -->
<div class="lock" id="lock">
  <h1>mis <em>finanzas</em></h1>
  <div class="lmsg" id="lock-msg">Ingresá tu PIN</div>
  <div class="pdots" id="pdots"><i></i><i></i><i></i><i></i></div>
  <div class="pad" id="pad"></div>
</div>

<nav class="nav">
  <div class="nav-l">
    <div class="nav-title">mis <em>finanzas</em></div>
    <div class="tabs" id="tabs">
      <button class="tab active" data-p="hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hoy</button>
      <button class="tab" data-p="proyeccion"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M4 16l5-5 4 3 7-8"/><path d="M15 6h5v5"/></svg>Proyección</button>
      <button class="tab" data-p="categorias"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Gastos</button>
      <button class="tab" data-p="tarjetas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19M6 15h4"/></svg>Tarjetas</button>
      <button class="tab" data-p="ahorro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l8-6 8 6"/><path d="M6 10v8M10 10v8M14 10v8M18 10v8M3 20h18"/></svg>Ahorro</button>
    </div>
  </div>
  <div class="nav-r">
    <span class="upd" id="upd"></span>
    <button class="ibtn" id="b-refresh" title="Actualizar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    <button class="ibtn" id="b-priv" title="Ocultar montos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    <button class="ibtn" id="b-config" title="Configuración"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </div>
</nav>
<div class="ptr" id="ptr">Soltá para actualizar</div>

<div class="page active" id="page-hoy"></div>
<div class="page" id="page-proyeccion"></div>
<div class="page" id="page-categorias"></div>
<div class="page" id="page-tarjetas"></div>
<div class="page" id="page-ahorro"></div>

<!-- CONFIGURACIÓN -->
<div class="modal-bg" id="m-config">
  <div class="modal">
    <h3>Configuración</h3>
    <p>La app lee la planilla <b>Finanzas personales</b> a través del Apps Script publicado como aplicación web. La URL y el token quedan guardados solo en este dispositivo.</p>
    <div class="fg"><label for="c-url">URL de la aplicación web</label><input id="c-url" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" spellcheck="false"></div>
    <div class="fg"><label for="c-token">Token</label><input id="c-token" type="password" autocomplete="off" spellcheck="false"></div>
    <div class="aviso err" id="c-err" style="display:none"></div>
    <div class="mbt">
      <button class="btn-o" id="c-cancel">Cancelar</button>
      <button class="btn" id="c-save">Probar y guardar</button>
    </div>
    <div class="msep"></div>
    <div class="mbt" style="justify-content:space-between">
      <button class="mlink" id="c-pin">Cambiar PIN</button>
      <button class="mlink" id="c-lock">Bloquear ahora</button>
      <button class="mlink" id="c-clear">Borrar datos del dispositivo</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════
   Mis Finanzas — vista de la planilla "Finanzas personales".
   La app no calcula montos: muestra lo que devuelve el Apps Script.
   localStorage guarda solo: URL, token, PIN (hash), modo privacidad y
   la última respuesta como caché offline.
   ════════════════════════════════════════════════════════════════════ */

const K = {url:'mf_url', token:'mf_token', pin:'mf_pin', priv:'mf_priv', cache:'mf_cache', tab:'mf_tab'};
const ls = {
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let D = null;          // última respuesta de la planilla
let D_AT = null;       // cuándo se obtuvo
let OFFLINE = false;
let ERROR = '';
const UI = {tarMes:null, catMes:null, catSel:null};

/* ── Formato argentino ─────────────────────────────────────────────── */
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sept','oct','nov','dic'];
const MES_IDX = {ene:0,feb:1,mar:2,abr:3,may:4,jun:5,jul:6,ago:7,sep:8,sept:8,set:8,oct:9,nov:10,dic:11};
const nf = {};
function num(v, d){
  const key = d==null ? 'x' : d;
  if(!nf[key]) nf[key] = new Intl.NumberFormat('es-AR', d==null ? {maximumFractionDigits:2} : {minimumFractionDigits:d, maximumFractionDigits:d});
  return nf[key].format(v);
}
// Clave de mes 'YYYY-MM' desde '2026-10-01', 'oct 2026' o 'octubre 2026'
function mesClave(v){
  if(v==null || v==='') return '';
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})/);
  if(m) return m[1]+'-'+m[2];
  m = s.toLowerCase().match(/^([a-zñ]+)\.?\s+(?:de\s+)?(\d{4})$/);
  if(m){ const i = MES_IDX[m[1].slice(0, m[1].startsWith('sept')?4:3)]; if(i!=null) return m[2]+'-'+String(i+1).padStart(2,'0'); }
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m) return m[3]+'-'+m[2].padStart(2,'0');
  return '';
}
function mesTexto(clave){
  const m = String(clave).match(/^(\d{4})-(\d{2})/);
  return m ? MESES[+m[2]-1]+' '+m[1] : String(clave);
}
function mesSumar(clave, n){
  const [y,m] = clave.split('-').map(Number);
  const t = y*12 + (m-1) + n;
  return Math.floor(t/12)+'-'+String(t%12+1).padStart(2,'0');
}
function fechaTexto(v){
  const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[3]+'/'+m[2]+'/'+m[1] : String(v);
}
function fechaCorta(v){
  const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? (+m[3])+' '+MESES[+m[2]-1] : String(v);
}
// Formatea un valor según el tipo de formato que tiene en la planilla.
// cero: qué mostrar cuando el monto es 0 (la planilla muestra "-").
function fmt(v, k, d, cero){
  if(v==null || v==='') return '';
  if(typeof v === 'string' && !/^(mes|fecha)$/.test(k)) return esc(v);
  switch(k){
    case 'mes': return esc(/^\d{4}-\d{2}/.test(v) ? mesTexto(v) : v);
    case 'fecha': return esc(/^\d{4}-\d{2}-\d{2}/.test(v) ? fechaTexto(v) : v);
    case 'ars': case 'usd': {
      const p = k==='usd' ? 'US$ ' : '$ ';
      if(v===0 || Math.abs(v) < Math.pow(10, -(d||0))/2) return '<span class="m">'+(cero!=null?cero:'-')+'</span>';
      return '<span class="m">'+(v<0?'-':'')+p+num(Math.abs(v), d||0)+'</span>';
    }
    case 'pct': return num(v*100, d==null?0:d)+'%';
    case 'num': return num(v, d);
    default: return esc(v);
  }
}
const ars = (v, cero) => typeof v==='number' ? fmt(v,'ars',0,cero) : fmt(v,'txt');

/* ── Acceso a los datos ─────────────────────────────────────────────── */
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
// Índice de columna por nombre de encabezado (exacto, o que empiece igual)
function ci(t, nombre){
  if(!t) return -1;
  const n = norm(nombre);
  let i = t.cols.findIndex(c => norm(c.n)===n);
  if(i<0) i = t.cols.findIndex(c => norm(c.n).startsWith(n));
  return i;
}
// Filas como objetos { campo: {v,k,d} } con acceso por nombre
function filas(t){
  if(!t) return [];
  return t.filas.map(f => ({
    raw: f,
    v: n => { const i = ci(t,n); return i<0 ? '' : f[i]; },
    f: (n, cero) => { const i = ci(t,n); if(i<0) return ''; const c = t.cols[i]; return fmt(f[i], c.k, c.d, cero); }
  }));
}
// Indicador de un bloque etiqueta/valor, buscado por etiqueta (y por celda si cambió el texto)
function ind(lista, patron, celda){
  if(!lista) return null;
  const re = patron instanceof RegExp ? patron : new RegExp('^'+patron, 'i');
  return lista.find(x => re.test(norm(x.l))) || (celda && lista.find(x => x.celda===celda)) || null;
}
const fi = (x, cero) => x ? fmt(x.v, x.k, x.d, cero) : '—';

function mesActual(){
  const x = ind(D.panel.indicadores, 'mes actual', 'B4');
  return x ? mesClave(x.v) : '';
}

/* ── Carga ──────────────────────────────────────────────────────────── */
function urlDatos(){
  const u = ls.get(K.url), t = ls.get(K.token);
  if(!u || !t) return null;
  return u + (u.includes('?')?'&':'?') + 'token=' + encodeURIComponent(t) + '&_=' + Date.now();
}
async function pedir(url){
  const ctl = new AbortController();
  const to = setTimeout(()=>ctl.abort(), 30000);
  try{
    const r = await fetch(url, {cache:'no-store', redirect:'follow', signal:ctl.signal});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    if(!j.ok) throw Object.assign(new Error(j.error || 'Error de la planilla'), {status:j.status});
    return j;
  } catch(e){
    if(e.name==='AbortError') throw new Error('La planilla tardó demasiado en responder.');
    if(e instanceof TypeError) throw Object.assign(new Error('Sin conexión con la planilla.'), {red:true});
    throw e;
  } finally { clearTimeout(to); }
}
let cargando = false;
async function cargar(manual){
  const url = urlDatos();
  if(!url){ abrirConfig(); return; }
  if(cargando) return;
  cargando = true;
  $('b-refresh').classList.add('girando');
  try{
    const j = await pedir(url);
    D = j; D_AT = new Date(); OFFLINE = false; ERROR = '';
    ls.set(K.cache, JSON.stringify({at:D_AT.toISOString(), d:j}));
    if(manual) toast('Datos actualizados');
  } catch(e){
    OFFLINE = !!e.red; ERROR = e.status===403 ? 'El token no es válido. Revisalo en Configuración.' : e.message;
    if(!D) leerCache();
    if(manual || !D) toast(ERROR);
  } finally {
    cargando = false;
    $('b-refresh').classList.remove('girando');
    render();
  }
}
function leerCache(){
  try{
    const c = JSON.parse(ls.get(K.cache) || 'null');
    if(c && c.d){ D = c.d; D_AT = new Date(c.at); }
  } catch(e){}
}

/* ── Render general ─────────────────────────────────────────────────── */
function render(){
  pintarActualizado();
  if(!D){
    const msg = ls.get(K.url)
      ? (ERROR ? '<div class="aviso err">'+esc(ERROR)+'</div>' : '<div class="vacio">Cargando la planilla…</div>')
      : '<div class="aviso">Configurá la URL del Apps Script y el token para ver tus datos.</div><button class="btn" onclick="abrirConfig()">Configurar</button>';
    document.querySelectorAll('.page').forEach(p => p.innerHTML = msg);
    return;
  }
  const pasos = [renderHoy, renderProyeccion, renderCategorias, renderTarjetas, renderAhorro];
  pasos.forEach(fn => { try{ fn(); } catch(e){ console.error(e); } });
}
function pintarActualizado(){
  const el = $('upd');
  if(!D_AT){ el.textContent=''; return; }
  const min = Math.round((Date.now()-D_AT)/60000);
  const hora = D_AT.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  const dia = D_AT.toDateString()===new Date().toDateString() ? hora : fechaCorta(D_AT.toISOString().slice(0,10))+' '+hora;
  el.textContent = (OFFLINE?'sin conexión · ':'') + (min<1 ? 'recién' : dia);
  el.title = 'Datos de la planilla al '+D_AT.toLocaleString('es-AR');
  el.classList.toggle('viejo', OFFLINE || min > 60*12);
}
function avisoEstado(){
  if(OFFLINE) return '<div class="aviso">Sin conexión. Mostrando los datos guardados ('+esc(fechaCorta(D_AT.toISOString().slice(0,10))+', '+D_AT.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false}))+').</div>';
  if(ERROR) return '<div class="aviso err">'+esc(ERROR)+' Mostrando los últimos datos guardados.</div>';
  return '';
}
function seccion(titulo, sub){
  return '<div class="sh"><h2>'+titulo+'</h2><div class="sr"></div>'+(sub?'<span class="ss">'+sub+'</span>':'')+'</div>';
}
function claseEstado(e){
  const n = norm(e);
  if(n.startsWith('pagado')) return 'e-pagado';
  if(n.startsWith('reservado')) return 'e-reservado';
  if(n.startsWith('parcial')) return 'e-parcial';
  if(n.startsWith('pendiente')) return 'e-pendiente';
  if(n.startsWith('revisar')) return 'e-revisar';
  return 'e-sin';
}
const pill = e => e ? '<span class="bdg '+claseEstado(e)+'">'+esc(e)+'</span>' : '';

/* ── HOY ────────────────────────────────────────────────────────────── */
function renderHoy(){
  const P = D.panel.indicadores, R = D.proyeccion.recomendacion;
  const mes = mesActual(), prox = mes ? mesSumar(mes,1) : '';
  const reservar = ind(R, 'reservar ahora', 'B8');
  const otrosR = R.filter(x => x!==reservar && !/^mes actual/.test(norm(x.l)));

  let h = avisoEstado();
  h += '<div class="sec"><div class="hero">'
    + '<div class="hl">'+esc(reservar ? reservar.l : 'Reservar ahora para el mes que viene')+(prox?' · '+mesTexto(prox):'')+'</div>'
    + '<div class="hv">'+fi(reservar,'$ 0')+'</div>'
    + '<div class="hrows">'+otrosR.map(x => '<div class="hr"><span>'+esc(x.l)+'</span><b>'+fi(x,'$ 0')+'</b></div>').join('')+'</div>'
    + (D.proyeccion.orden ? '<div class="hnote">'+esc(D.proyeccion.orden)+'</div>' : '')
    + '</div></div>';

  // Indicadores del Panel, en el mismo orden que la planilla
  const mesInd = ind(P, 'mes actual', 'B4');
  h += '<div class="sec">'+seccion('Este mes', mesInd ? fi(mesInd) : '')+'<div class="g g4">'
    + P.filter(x => x!==mesInd).map(x => {
        const n = norm(x.l);
        const cls = /^falta/.test(n) ? (x.v>0?'rl':'gl') : /terceros/.test(n) ? 'bl link' : /reserva|meses cubiertos/.test(n) ? 'al' : '';
        const nav = /terceros/.test(n) ? ' onclick="irA(\'ahorro\',\'terceros\')"' : '';
        return '<div class="card '+cls+'"'+nav+'><div class="cl">'+esc(x.l)+'</div><div class="cv">'+fi(x,'$ 0')+'</div></div>';
      }).join('')
    + '</div></div>';

  // Estado de cada tarjeta del mes que viene
  const res = filas(D.resumenes).filter(r => mesClave(r.v('Mes'))===prox);
  h += '<div class="sec">'+seccion('Tarjetas de '+mesTexto(prox), '<a href="#" onclick="irA(\'tarjetas\',null,\''+prox+'\');return false" style="color:inherit">ver todas</a>')
    + '<div class="lst">'+(res.length ? res.map(r => {
        const falta = r.v('Falta'), sinCons = norm(r.v('Estado')).startsWith('sin');
        return '<div class="li"><div class="lm"><div class="lt">'+esc(r.v('Tarjeta o medio'))+'</div>'
          + '<div class="ls">'+pill(r.v('Estado'))+(sinCons?'':' total '+r.f('Total del resumen','$ 0'))+'</div></div>'
          + '<div class="lv">'+(sinCons?'<span class="muted">—</span>':(typeof falta==='number' && Math.abs(falta)>=0.5 ? '<span class="neg">'+ars(falta)+'</span><small>falta</small>' : '<span class="pos">cubierto</span>'))+'</div></div>';
      }).join('') : '<div class="vacio">No hay resúmenes cargados para '+mesTexto(prox)+'.</div>')+'</div></div>';

  // Próximos vencimientos de frascos
  const hoyIso = new Date().toISOString().slice(0,10);
  const act = filas(D.reservas).filter(r => norm(r.v('Estado'))==='activa');
  const conVto = act.filter(r => /^\d{4}-\d{2}-\d{2}$/.test(r.v('Vencimiento'))).sort((a,b) => a.v('Vencimiento')<b.v('Vencimiento')?-1:1);
  const sinVto = act.filter(r => !/^\d{4}-\d{2}-\d{2}$/.test(r.v('Vencimiento')));
  const lista = conVto.concat(sinVto).slice(0, 8);
  h += '<div class="sec">'+seccion('Próximos vencimientos', act.length+' reservas activas')
    + '<div class="lst">'+(lista.length ? lista.map(r => {
        const vto = r.v('Vencimiento'); const dias = vto ? Math.round((new Date(vto+'T00:00')-new Date(hoyIso+'T00:00'))/864e5) : null;
        const cuando = vto ? (dias<0 ? 'venció' : dias===0 ? 'hoy' : dias===1 ? 'mañana' : 'en '+dias+' días') : 'sin vencimiento';
        return '<div class="li"><div class="lm"><div class="lt">'+esc(r.v('Concepto'))+' <span class="muted">· '+esc(r.v('Tarjeta o medio'))+'</span></div>'
          + '<div class="ls">'+esc(r.v('Lugar o instrumento'))+' · pago de '+esc(mesTexto(mesClave(r.v('Mes del pago'))||r.v('Mes del pago')))+(r.v('Notas')?' · '+esc(r.v('Notas')):'')+'</div></div>'
          + '<div class="lv">'+r.f('Monto en ARS')+'<small'+(dias!=null&&dias<=3?' class="neg"':'')+'>'+(vto?fechaCorta(vto)+' · ':'')+cuando+'</small></div></div>';
      }).join('') : '<div class="vacio">No hay reservas activas.</div>')+'</div>'
    + (act.length>lista.length ? '<div class="lead" style="margin-top:8px">Y '+(act.length-lista.length)+' más en la pestaña Ahorro.</div>' : '')
    + '</div>';

  $('page-hoy').innerHTML = h;
}

/* ── PROYECCIÓN ─────────────────────────────────────────────────────── */
function renderProyeccion(){
  const t = D.proyeccion.tabla, M = D.proyeccion.metas;
  const F = filas(t);
  const metaMin = ind(M, 'llegas a la meta minima', 'E7'), metaMax = ind(M, 'llegas a la meta maxima', 'E8');
  const txtMin = metaMin ? fmt(metaMin.v, metaMin.k==='txt'&&mesClave(metaMin.v)?'mes':metaMin.k) : '';
  const txtMax = metaMax ? fmt(metaMax.v, metaMax.k==='txt'&&mesClave(metaMax.v)?'mes':metaMax.k) : '';
  const kMin = metaMin ? mesClave(metaMin.v) : '', kMax = metaMax ? mesClave(metaMax.v) : '';

  let h = avisoEstado();
  if(D.proyeccion.nota) h += '<div class="lead">'+esc(D.proyeccion.nota)+'</div>';
  h += '<div class="metas">'
    + '<div class="card al"><div class="cl">'+esc(metaMin?metaMin.l:'Meta mínima')+'</div><div class="cv">'+(txtMin||'—')+'</div><div class="cs">'+fi(ind(M,'meta minima de reserva','E5'))+'</div></div>'
    + '<div class="card al"><div class="cl">'+esc(metaMax?metaMax.l:'Meta máxima')+'</div><div class="cv">'+(txtMax||'—')+'</div><div class="cs">'+fi(ind(M,'meta maxima de reserva','E6'))+'</div></div>'
    + '</div>';

  h += '<div class="sec">'+seccion('Ingresos, gastos y reserva', '12 meses')
    + '<div class="chart" id="ch-proy"><div class="leg">'
    + '<span><i style="background:var(--s1)"></i>Ingresos proyectados</span>'
    + '<span><i style="background:var(--s2)"></i>Gastos totales</span>'
    + '<span><i class="ln" style="background:var(--s3)"></i>Reserva acumulada</span>'
    + '</div><div class="ch-svg"></div><div class="tip"></div></div></div>';

  const otros = M.filter(x => x!==metaMin && x!==metaMax && !/meta (minima|maxima) de reserva/.test(norm(x.l)));
  if(otros.length) h += '<div class="sec"><div class="g g4">'+otros.map(x => '<div class="card"><div class="cl">'+esc(x.l)+'</div><div class="cv">'+fi(x,'$ 0')+'</div></div>').join('')+'</div></div>';

  // Tabla mes a mes
  const iMes = ci(t,'Mes'), iLect = ci(t,'Lectura');
  h += '<div class="sec">'+seccion('Mes a mes')
    + '<div class="tw tscroll"><table><thead><tr>'
    + t.cols.map((c,i) => '<th class="'+(i===iMes?'sticky':(c.k==='txt'?'':'r'))+'">'+esc(c.n)+'</th>').join('')
    + '</tr></thead><tbody>'
    + t.filas.map(f => {
        const k = mesClave(f[iMes]);
        const marca = (k && (k===kMin || k===kMax));
        return '<tr'+(marca?' class="marca"':'')+'>'+f.map((v,i) => {
          const c = t.cols[i];
          if(i===iLect) return '<td>'+lectura(v)+'</td>';
          if(i===iMes) return '<td class="sticky"><b>'+fmt(v,c.k==='txt'?'mes':c.k)+'</b>'+(k===kMin?' <span class="bdg e-parcial">mín.</span>':'')+(k===kMax?' <span class="bdg e-pagado">máx.</span>':'')+'</td>';
          return '<td class="'+(c.k==='txt'?'':'r')+(typeof v==='number'&&v<0?' neg':'')+'">'+fmt(v,c.k,c.d)+'</td>';
        }).join('')+'</tr>';
      }).join('')
    + '</tbody></table></div></div>';

  $('page-proyeccion').innerHTML = h;

  graficoProyeccion($('ch-proy'), F.map(r => ({
    mes: mesClave(r.v('Mes')) || r.v('Mes'),
    ing: +r.v('Ingresos proyectados') || 0,
    gas: +r.v('Gastos totales') || 0,
    res: typeof r.v('Reserva acumulada')==='number' ? r.v('Reserva acumulada') : null,
    cub: r.raw[ci(t,'Meses cubiertos')], cubT: t.cols[ci(t,'Meses cubiertos')]
  })));
}
function lectura(v){
  if(!v) return '';
  const n = norm(v);
  const cls = /deficit|falta|no alcanza/.test(n) ? 'e-pendiente' : /reserva/.test(n) ? 'e-pagado' : /invertir/.test(n) ? 'e-reservado' : 'e-sin';
  return '<span class="bdg '+cls+'">'+esc(v)+'</span>';
}
// Ancho real del contenedor: el SVG se dibuja 1:1 para que el texto no se achique
const anchoGrafico = cont => Math.max(300, Math.round((cont.clientWidth || 640) - 28));
// Escala "linda" para el eje
function escala(max){
  if(max<=0) return {max:1, paso:1};
  const exp = Math.pow(10, Math.floor(Math.log10(max)));
  const pasos = [1,2,2.5,5,10].map(x=>x*exp);
  for(const p of pasos){ if(max/p <= 5) return {max:Math.ceil(max/p)*p, paso:p}; }
  return {max, paso:max/4};
}
const corto = v => { const a=Math.abs(v); return (v<0?'-':'')+(a>=1e6 ? num(a/1e6, a>=1e7?0:1)+' M' : a>=1e3 ? num(a/1e3,0)+' mil' : num(a,0)); };

function graficoProyeccion(cont, datos){
  if(!cont || !datos.length) return;
  const W = anchoGrafico(cont), H = W<500 ? 220 : 260, pl = 46, pr = 8, pt = 10, pb = 24;
  const iw = W-pl-pr, ih = H-pt-pb;
  const maxV = Math.max(...datos.map(d => Math.max(d.ing, d.gas, d.res||0)));
  const minV = Math.min(0, ...datos.map(d => d.res==null?0:d.res));
  const e = escala(maxV);
  const lo = minV<0 ? -escala(-minV).max : 0;
  const y = v => pt + ih - (v-lo)/(e.max-lo)*ih;
  const bw = iw/datos.length;
  const barW = Math.max(3, Math.min(14, bw*0.3));
  let s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ingresos y gastos proyectados por mes, con la reserva acumulada">';
  for(let v=lo; v<=e.max+1e-6; v+=e.paso){
    s += '<line class="grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'"/>';
    s += '<text class="ax m" x="'+(pl-6)+'" y="'+(y(v)+3)+'" text-anchor="end">'+corto(v)+'</text>';
  }
  datos.forEach((d,i) => {
    const cx = pl + bw*i + bw/2;
    const b = (v, x, col) => { const h = Math.abs(y(v)-y(0)); if(h<0.5) return ''; const y0 = Math.min(y(v),y(0)); const r = Math.min(4, barW/2, h);
      return '<path d="M'+x+','+(y0+h)+' V'+(y0+r)+' Q'+x+','+y0+' '+(x+r)+','+y0+' H'+(x+barW-r)+' Q'+(x+barW)+','+y0+' '+(x+barW)+','+(y0+r)+' V'+(y0+h)+' Z" fill="'+col+'"/>'; };
    s += b(d.ing, cx-barW-1, 'var(--s1)') + b(d.gas, cx+1, 'var(--s2)');
    if(bw >= 30 || i%2===0) s += '<text class="ax" x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">'+esc(MESES[+String(d.mes).slice(5,7)-1]||d.mes)+'</text>';
  });
  s += '<line class="base" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(0)+'" y2="'+y(0)+'"/>';
  const pts = datos.map((d,i) => d.res==null ? null : [pl+bw*i+bw/2, y(d.res)]).filter(Boolean);
  if(pts.length){
    s += '<polyline points="'+pts.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    s += pts.map(p => '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.5" fill="var(--s3)" stroke="var(--card)" stroke-width="2"/>').join('');
  }
  s += '<line class="hl" x1="0" x2="0" y1="'+pt+'" y2="'+(pt+ih)+'" stroke="var(--muted2)" stroke-dasharray="3 3" style="display:none"/>';
  s += '<rect x="'+pl+'" y="0" width="'+iw+'" height="'+H+'" fill="transparent" class="hit"/>';
  s += '</svg>';
  cont.querySelector('.ch-svg').innerHTML = s;
  hover(cont, datos.length, i => {
    const d = datos[i];
    return '<b>'+esc(/^\d{4}-\d{2}$/.test(d.mes)?mesTexto(d.mes):d.mes)+'</b>'
      + '<div class="tr"><span><i style="background:var(--s1)"></i>Ingresos</span><span>'+ars(d.ing,'$ 0')+'</span></div>'
      + '<div class="tr"><span><i style="background:var(--s2)"></i>Gastos</span><span>'+ars(d.gas,'$ 0')+'</span></div>'
      + (d.res!=null ? '<div class="tr"><span><i style="background:var(--s3)"></i>Reserva</span><span>'+ars(d.res,'$ 0')+'</span></div>' : '')
      + (d.cub!=null && d.cub!=='' ? '<div class="tr"><span>Meses cubiertos</span><span>'+fmt(d.cub, d.cubT.k, d.cubT.d)+'</span></div>' : '');
  }, {pl, iw, W});
}
// Tooltip por columna (mouse y dedo)
function hover(cont, n, html, g){
  const svg = cont.querySelector('svg'), tip = cont.querySelector('.tip'), hl = svg.querySelector('.hl');
  const mover = ev => {
    const r = svg.getBoundingClientRect();
    const x = (ev.clientX - r.left) * (g.W / r.width);
    const i = Math.max(0, Math.min(n-1, Math.floor((x - g.pl) / (g.iw/n))));
    tip.innerHTML = html(i);
    tip.classList.add('on');
    const cx = g.pl + g.iw/n*(i+.5);
    if(hl){ hl.setAttribute('x1',cx); hl.setAttribute('x2',cx); hl.style.display=''; }
    const cr = cont.getBoundingClientRect();
    let left = (cx * r.width / g.W) + (r.left - cr.left) + 12;
    if(left + tip.offsetWidth > cont.clientWidth - 4) left = left - tip.offsetWidth - 24;
    tip.style.left = Math.max(4,left)+'px';
    tip.style.top = (r.top - cr.top + 10)+'px';
  };
  const salir = () => { tip.classList.remove('on'); if(hl) hl.style.display='none'; };
  svg.addEventListener('pointermove', mover);
  svg.addEventListener('pointerdown', mover);
  svg.addEventListener('pointerleave', salir);
}

const SERIES = ['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--s6)','var(--s7)'];
function renderCategorias(){
  const t = D.categorias.tabla;
  if(!t){ $('page-categorias').innerHTML = '<div class="vacio">No se encontró la tabla de Categorías.</div>'; return; }
  const meses = t.cols.slice(1).map((c,i) => ({i:i+1, c, k: mesClave(c.n) || (c.n.match(/^\d{4}-\d{2}/)?c.n.slice(0,7):'')})).filter(x => x.k);
  const iPct = ci(t, '% del mes');
  const actual = mesActual();
  if(!UI.catMes || !meses.some(m => m.k===UI.catMes)) UI.catMes = (meses.find(m => m.k===actual) || meses[0] || {}).k;
  const mSel = meses.find(m => m.k===UI.catMes);
  const cats = t.filas.map(f => ({nombre: String(f[0]), vals: f}));

  // Colores: las 7 categorías más grandes del mes actual tienen color propio; el resto, gris.
  if(!mSel){ $('page-categorias').innerHTML = '<div class="vacio">La tabla de Categorías no tiene meses.</div>'; return; }
  const mAct = meses.find(m => m.k===actual) || mSel;
  const orden = cats.filter(c => typeof c.vals[mAct.i]==='number' && c.vals[mAct.i]>0).sort((a,b) => b.vals[mAct.i]-a.vals[mAct.i]);
  const color = {};
  orden.slice(0, 7).forEach((c,i) => color[c.nombre] = SERIES[i]);
  const col = n => color[n] || 'var(--s-resto)';

  let h = avisoEstado();
  if(D.categorias.nota) h += '<div class="lead">'+esc(D.categorias.nota)+'</div>';
  h += '<div class="mnav">'+meses.map(m => '<button class="mbtn'+(m.k===UI.catMes?' active':'')+'" onclick="UI.catMes=\''+m.k+'\';UI.catSel=null;renderCategorias()">'+mesTexto(m.k)+'</button>').join('')+'</div>';

  // Dona + lista del mes elegido
  const enMes = cats.filter(c => typeof c.vals[mSel.i]==='number' && c.vals[mSel.i]>0);
  const total = t.total ? t.total[mSel.i] : null;
  h += '<div class="sec">'+seccion('Mes de '+mesTexto(mSel.k), total!=null ? 'total '+ars(total) : '')
    + '<div class="chart" id="ch-dona"><div class="donut-w"><div class="dsvg"></div><div class="dl">'
    + '<div class="lst" style="box-shadow:none">'
    + cats.map(c => {
        const v = c.vals[mSel.i]; const tiene = typeof v==='number' && v!==0;
        const abierto = UI.catSel===c.nombre;
        const pct = (iPct>=0 && mSel.k===actual && typeof c.vals[iPct]==='number') ? '<small>'+fmt(c.vals[iPct],t.cols[iPct].k,t.cols[iPct].d)+'</small>' : '';
        return '<div class="li click'+(abierto?' sel':'')+'" style="padding:9px 10px'+(tiene?'':';opacity:.45')+'" onclick="UI.catSel=UI.catSel===this.dataset.c?null:this.dataset.c;renderCategorias()" data-c="'+esc(c.nombre)+'">'
          + '<i style="width:10px;height:10px;border-radius:2px;background:'+col(c.nombre)+';flex-shrink:0"></i>'
          + '<div class="lm"><div class="lt">'+esc(c.nombre)+'</div></div><div class="lv">'+ars(v)+pct+'</div></div>'
          + (abierto ? detalleCategoria(c.nombre, mSel.k) : '');
      }).join('')
    + (total!=null ? '<div class="li tot" style="padding:9px 10px"><div class="lm">Total</div><div class="lv">'+ars(total)+'</div></div>' : '')
    + '</div></div></div><div class="tip"></div></div></div>';

  // Barras apiladas de los meses
  h += '<div class="sec">'+seccion('Próximos meses')
    + '<div class="chart" id="ch-apil"><div class="leg">'
    + orden.slice(0,7).map(c => '<span><i style="background:'+col(c.nombre)+'"></i>'+esc(c.nombre)+'</span>').join('')
    + (cats.length>7 ? '<span><i style="background:var(--s-resto)"></i>Resto</span>' : '')
    + '</div><div class="ch-svg"></div><div class="tip"></div></div>'
    + '<div class="lead" style="margin-top:8px">Tocá una barra para ver ese mes.</div></div>';

  $('page-categorias').innerHTML = h;
  dona($('ch-dona'), enMes.map(c => ({n:c.nombre, v:c.vals[mSel.i], col:col(c.nombre)})), total);
  apiladas($('ch-apil'), meses, cats, color, col);
}
function dona(cont, segs, total){
  const R = 70, r0 = 52, C = 2*Math.PI*((R+r0)/2), sw = R-r0, rm = (R+r0)/2;
  const suma = segs.reduce((a,s) => a+s.v, 0);
  let s = '<svg viewBox="0 0 180 180" role="img" aria-label="Gastos por categoría">';
  if(suma>0){
    let acc = 0;
    segs.forEach((g,i) => {
      const len = g.v/suma*C, gap = segs.length>1 ? Math.min(2, len*0.3) : 0;
      s += '<circle cx="90" cy="90" r="'+rm+'" fill="none" stroke="'+g.col+'" stroke-width="'+sw+'" stroke-dasharray="'+Math.max(0,len-gap)+' '+(C-len+gap)+'" stroke-dashoffset="'+(-acc)+'" transform="rotate(-90 90 90)" data-i="'+i+'" style="cursor:pointer"/>';
      acc += len;
    });
  } else s += '<circle cx="90" cy="90" r="'+rm+'" fill="none" stroke="var(--cream)" stroke-width="'+sw+'"/>';
  s += '<text x="90" y="86" text-anchor="middle" style="font-size:9px;fill:var(--muted);letter-spacing:1px">TOTAL</text>';
  s += '<text x="90" y="104" text-anchor="middle" class="m" style="font-family:\'Instrument Serif\',serif;font-size:19px;fill:var(--ink)">'+(total!=null ? (total ? '$ '+corto(total) : '-') : '')+'</text></svg>';
  cont.querySelector('.dsvg').innerHTML = s;
  const tip = cont.querySelector('.tip');
  cont.querySelectorAll('circle[data-i]').forEach(el => {
    const g = segs[+el.dataset.i];
    el.addEventListener('pointerenter', ev => { tip.innerHTML = '<b>'+esc(g.n)+'</b>'+ars(g.v); tip.classList.add('on'); posTip(cont, tip, ev); });
    el.addEventListener('pointermove', ev => posTip(cont, tip, ev));
    el.addEventListener('pointerleave', () => tip.classList.remove('on'));
    el.addEventListener('click', () => { UI.catSel = g.n; renderCategorias(); });
  });
}
function posTip(cont, tip, ev){
  const cr = cont.getBoundingClientRect();
  let left = ev.clientX - cr.left + 12; if(left + tip.offsetWidth > cont.clientWidth) left = ev.clientX - cr.left - tip.offsetWidth - 12;
  tip.style.left = Math.max(4,left)+'px'; tip.style.top = (ev.clientY - cr.top + 12)+'px';
}
function apiladas(cont, meses, cats, color, col){
  const W = anchoGrafico(cont), H = 220, pl = 46, pr = 8, pt = 8, pb = 24, iw = W-pl-pr, ih = H-pt-pb;
  const datos = meses.map(m => {
    const partes = [];
    let resto = 0;
    cats.forEach(c => { const v = c.vals[m.i]; if(typeof v!=='number' || v<=0) return; if(color[c.nombre]) partes.push({n:c.nombre, v, col:col(c.nombre)}); else resto += v; });
    partes.sort((a,b) => Object.keys(color).indexOf(a.n) - Object.keys(color).indexOf(b.n));
    if(resto>0) partes.push({n:'Resto', v:resto, col:'var(--s-resto)', resto:true});
    return {m, partes, suma: partes.reduce((a,p)=>a+p.v,0)};
  });
  const e = escala(Math.max(...datos.map(d=>d.suma), 1));
  const y = v => pt + ih - v/e.max*ih;
  const bw = iw/datos.length, barW = Math.min(46, bw*0.55);
  let s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gastos por categoría y mes">';
  for(let v=0; v<=e.max+1e-6; v+=e.paso) s += '<line class="grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="ax m" x="'+(pl-6)+'" y="'+(y(v)+3)+'" text-anchor="end">'+corto(v)+'</text>';
  datos.forEach((d,i) => {
    const x = pl + bw*i + (bw-barW)/2;
    let acc = 0;
    d.partes.forEach((p,j) => {
      const y1 = y(acc+p.v), y0 = y(acc), h = Math.max(0, y0-y1-(j<d.partes.length-1?0:0));
      const gap = j>0 ? 2 : 0;
      if(j===d.partes.length-1){ const r = Math.min(4, h-gap); s += '<path d="M'+x+','+(y0-gap)+' V'+(y1+r)+' Q'+x+','+y1+' '+(x+r)+','+y1+' H'+(x+barW-r)+' Q'+(x+barW)+','+y1+' '+(x+barW)+','+(y1+r)+' V'+(y0-gap)+' Z" fill="'+p.col+'"/>'; }
      else s += '<rect x="'+x+'" y="'+y1+'" width="'+barW+'" height="'+Math.max(0,h-gap)+'" fill="'+p.col+'"/>';
      acc += p.v;
    });
    s += '<text class="ax" x="'+(x+barW/2)+'" y="'+(H-8)+'" text-anchor="middle"'+(d.m.k===UI.catMes?' style="fill:var(--ink);font-weight:600"':'')+'>'+(bw<60 ? MESES[+d.m.k.slice(5,7)-1] : mesTexto(d.m.k))+'</text>';
  });
  s += '<line class="base" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(0)+'" y2="'+y(0)+'"/>';
  s += '<line class="hl" x1="0" x2="0" y1="'+pt+'" y2="'+(pt+ih)+'" stroke="none"/>';
  s += '</svg>';
  cont.querySelector('.ch-svg').innerHTML = s;
  hover(cont, datos.length, i => '<b>'+mesTexto(datos[i].m.k)+'</b>'+datos[i].partes.slice().reverse().map(p => '<div class="tr"><span><i style="background:'+p.col+'"></i>'+esc(p.n)+'</span><span>'+ars(p.v)+'</span></div>').join(''), {pl, iw, W});
  cont.querySelector('svg').addEventListener('click', ev => {
    const r = ev.currentTarget.getBoundingClientRect();
    const x = (ev.clientX - r.left) * (W / r.width);
    const i = Math.floor((x-pl)/bw);
    if(datos[i]){ UI.catMes = datos[i].m.k; UI.catSel = null; renderCategorias(); window.scrollTo({top:0, behavior:'smooth'}); }
  });
}
// Movimientos y gastos fijos de una categoría en un mes (filtrado, sin sumar)
function detalleCategoria(cat, mes){
  const terceros = /^adelantos a terceros/.test(norm(cat));
  const enRango = (desde, hasta) => { const a = mesClave(desde), b = mesClave(hasta); return a && a<=mes && (!b || mes<=b); };
  const esPropio = r => { const q = norm(r.v('A cargo de')); return !q || q==='propio'; };
  const mov = filas(D.movimientos).filter(r =>
    (terceros ? !esPropio(r) : esPropio(r) && norm(r.v('Categoría'))===norm(cat)) && enRango(r.v('Primer resumen'), r.v('Último resumen')));
  const fij = filas(D.fijos).filter(r =>
    (terceros ? !esPropio(r) : esPropio(r) && norm(r.v('Categoría'))===norm(cat)) && enRango(r.v('Desde'), r.v('Hasta (calculado)') || r.v('Hasta')));
  if(!mov.length && !fij.length) return '<div class="det"><div class="dn">No hay movimientos ni gastos fijos de esta categoría en '+mesTexto(mes)+'.</div></div>';
  return '<div class="det">'
    + fij.map(r => '<div class="di"><span>'+esc(r.v('Concepto'))+' <small>· fijo'+(terceros?' · '+esc(r.v('A cargo de')):'')+'</small></span><span>'+r.f('Monto mensual')+'</span></div>').join('')
    + mov.map(r => '<div class="di"><span>'+esc(r.v('Concepto'))+' <small>· '+esc(r.v('Tarjeta'))+(terceros?' · '+esc(r.v('A cargo de')):'')+(norm(r.v('Estimado'))==='si'?' · estimado':'')+(r.v('Moneda')&&r.v('Moneda')!=='ARS'?' · '+esc(r.v('Moneda')):'')+'</small></span><span>'+r.f('Cuota con recargo')+'</span></div>').join('')
    + '<div class="dn">Cuotas con recargo de Movimientos y montos de Fijos. El total de la categoría es el de la planilla.</div></div>';
}

          const v = pf.raw[i];
          return '<div class="card'+(/^falta/.test(norm(n)) ? (v>0?' rl':' gl') : '')+'"><div class="cl">'+esc(pt.cols[i].n)+'</div><div class="cv">'+fmt(v,pt.cols[i].k,pt.cols[i].d,'$ 0')+'</div></div>';

/* ── AHORRO E INVERSIÓN + TERCEROS ──────────────────────────────────── */
function renderAhorro(){
  const P = D.panel.indicadores;
  const reserva = ind(P,'reserva de emergencia','B9'), meses = ind(P,'meses cubiertos','B10');
  const fMin = ind(P,'falta para el minimo','B11'), fMax = ind(P,'falta para el maximo','B12');
  const obj = ind(P,'inversion mensual objetivo','E5'), inv = ind(P,'invertido este mes','E6'), faltaInv = ind(P,'falta invertir','E7');
  const cUsd = ind(P,'cartera en el broker \\(usd','E9'), cArs = ind(P,'cartera en el broker \\(ars','E10');
  const pctObj = ind(D.config.indicadores, 'inversion objetivo');
  const mes = mesActual();

  let h = avisoEstado();
  h += '<div class="sec">'+seccion('Reserva de emergencia')+'<div class="g g4">'
    + [reserva, meses, fMin, fMax].filter(Boolean).map((x,i) => '<div class="card '+(i===0?'dk':i===1?'al':(x.v>0?'rl':'gl'))+'"><div class="cl">'+esc(x.l)+'</div><div class="cv">'+fi(x,'$ 0')+'</div></div>').join('')
    + '</div></div>';

  const avance = (obj && inv && obj.v>0) ? Math.max(0, Math.min(1, (+inv.v||0)/obj.v)) : null;
  h += '<div class="sec">'+seccion('Inversión de '+mesTexto(mes), pctObj ? 'objetivo '+fi(pctObj)+' de los ingresos' : '')
    + '<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">'
    + '<div><div class="cl">'+esc(inv?inv.l:'Invertido')+'</div><div class="cv">'+fi(inv,'$ 0')+'</div></div>'
    + '<div style="text-align:right"><div class="cl">'+esc(obj?obj.l:'Objetivo')+'</div><div class="cv">'+fi(obj,'$ 0')+'</div></div></div>'
    + (avance!=null ? '<div class="prog" role="img" aria-label="Avance de la inversión del mes"><i style="width:'+(avance*100)+'%"></i></div>' : '')
    + (faltaInv ? '<div class="cs">'+esc(faltaInv.l)+': <b>'+fi(faltaInv,'$ 0')+'</b></div>' : '')
    + '</div>';
  const invMes = filas(D.inversiones).filter(r => mesClave(r.v('Mes'))===mes || mesClave(r.v('Fecha'))===mes);
  if(invMes.length) h += '<div class="lst" style="margin-top:9px">'+invMes.map(r => '<div class="li"><div class="lm"><div class="lt">'+esc(r.v('Instrumento'))+'</div><div class="ls">'+r.f('Fecha')+(r.v('Notas')?' · '+esc(r.v('Notas')):'')+'</div></div><div class="lv">'+r.f('Monto en ARS')+(r.v('Moneda')&&r.v('Moneda')!=='ARS'?'<small>'+r.f('Monto')+' '+esc(r.v('Moneda'))+'</small>':'')+'</div></div>').join('')+'</div>';
  h += '</div>';

  // Cartera
  const ct = D.cartera, tipos = filas(D.carteraPorTipo);
  const iValUsd = ci(D.carteraPorTipo,'Valor');
  const maxTipo = Math.max(1, ...tipos.map(r => +r.raw[iValUsd]||0));
  h += '<div class="sec">'+seccion('Cartera en el broker', [cUsd, cArs].filter(Boolean).map(x => fi(x)).join(' · '))
    + (tipos.length ? '<div class="lst" style="margin-bottom:9px">'+tipos.map(r => {
        const v = +r.raw[iValUsd]||0;
        return '<div class="li"><div class="lm"><div class="lt">'+esc(r.raw[0])+'</div><div class="prog" style="margin:6px 0 0;height:6px"><i style="width:'+(v/maxTipo*100)+'%;background:var(--s1)"></i></div></div><div class="lv">'+fmt(r.raw[iValUsd], D.carteraPorTipo.cols[iValUsd].k, D.carteraPorTipo.cols[iValUsd].d)+'</div></div>';
      }).join('')+'</div>' : '')
    + '<div class="tw tscroll"><table><thead><tr>'+ct.cols.map((c,i) => '<th class="'+(c.k==='txt'?'':'r')+'">'+esc(c.n)+'</th>').join('')+'</tr></thead><tbody>'
    + ct.filas.map(f => '<tr>'+f.map((v,i) => '<td class="'+(ct.cols[i].k==='txt'?'':'r')+(typeof v==='number'&&v<0&&/rendimiento/.test(norm(ct.cols[i].n))?' neg':'')+'">'+fmt(v,ct.cols[i].k,ct.cols[i].d)+'</td>').join('')+'</tr>').join('')
    + (ct.total ? '<tr class="tot">'+ct.total.map((v,i) => '<td class="'+(ct.cols[i].k==='txt'?'':'r')+'">'+fmt(v,ct.cols[i].k,ct.cols[i].d)+'</td>').join('')+'</tr>' : '')
    + '</tbody></table></div></div>';

  // Reservas activas (frascos)
  const act = filas(D.reservas).filter(r => norm(r.v('Estado'))==='activa');
  const lugares = {};
  act.forEach(r => { const l = r.v('Lugar o instrumento') || '—'; (lugares[l] = lugares[l] || []).push(r); });
  h += '<div class="sec">'+seccion('Reservas activas', act.length+' frascos')
    + '<div class="lst">'+(act.length ? Object.entries(lugares).map(([l, rs]) =>
        '<div class="li tot" style="font-weight:500;padding:8px 14px"><div class="lm">'+esc(l)+'</div><div class="lv muted" style="font-size:10px;font-weight:400">'+rs.length+'</div></div>'
        + rs.map(r => '<div class="li"><div class="lm"><div class="lt">'+esc(r.v('Concepto'))+' <span class="muted">· '+esc(r.v('Tarjeta o medio'))+'</span></div><div class="ls">'+esc(r.v('Destino'))+' · '+esc(mesTexto(mesClave(r.v('Mes del pago'))||r.v('Mes del pago')))+(r.v('Tasa anual')!==''?' · '+r.f('Tasa anual'):'')+'</div></div><div class="lv">'+r.f('Monto en ARS')+(r.v('Vencimiento')?'<small>vence '+fechaCorta(r.v('Vencimiento'))+'</small>':'')+'</div></div>').join('')
      ).join('') : '<div class="vacio">No hay reservas activas.</div>')+'</div></div>';

  // Terceros
  const tt = D.terceros, T = filas(tt).filter(r => r.v('Persona'));
  const iSaldo = ci(tt,'Saldo a cobrar');
  h += '<div class="sec" id="terceros">'+seccion('Terceros', 'lo que te deben')
    + '<div class="lst">'+T.map(r => {
        const ini = r.v('Saldo inicial'), ad = r.v('Adelantado'), pag = r.v('Pagos recibidos');
        const det = [];
        if(typeof ini==='number' && ini) det.push('inicial '+r.f('Saldo inicial')+(r.v('Saldo inicial al')?' ('+r.f('Saldo inicial al')+')':''));
        if(typeof ad==='number' && ad) det.push('adelantado '+r.f('Adelantado'));
        if(typeof pag==='number' && pag) det.push('pagó '+r.f('Pagos recibidos'));
        const v = r.raw[iSaldo];
        return '<div class="li"'+(typeof v==='number'&&v!==0?'':' style="opacity:.5"')+'><div class="lm"><div class="lt">'+esc(r.v('Persona'))+'</div>'+(det.length?'<div class="ls">'+det.join(' · ')+'</div>':'')+'</div><div class="lv">'+r.f('Saldo a cobrar')+'</div></div>';
      }).join('')
    + (tt.total && iSaldo>=0 ? '<div class="li tot"><div class="lm">Total</div><div class="lv">'+fmt(tt.total[iSaldo], tt.cols[iSaldo].k, tt.cols[iSaldo].d)+'</div></div>' : '')
    + '</div>'
    + (tt.notas && tt.notas.length ? '<div class="lead" style="margin-top:8px">'+tt.notas.map(esc).join('<br>')+'</div>' : '');
  const pagos = filas(D.pagosTerceros).slice(-8).reverse();
  if(pagos.length) h += '<div class="lst" style="margin-top:9px">'+pagos.map(r => '<div class="li"><div class="lm"><div class="lt">'+esc(r.v('Persona'))+'</div><div class="ls">'+r.f('Fecha')+(r.v('Concepto')?' · '+esc(r.v('Concepto')):'')+'</div></div><div class="lv pos">'+r.f('Monto')+'</div></div>').join('')+'</div>';
  h += '</div>';

  $('page-ahorro').innerHTML = h;
}

/* ── Navegación ─────────────────────────────────────────────────────── */
const PAGINAS = {hoy:()=>renderHoy(), proyeccion:()=>renderProyeccion(), categorias:()=>renderCategorias(), tarjetas:()=>renderTarjetas(), ahorro:()=>renderAhorro()};
let actualP = 'hoy';
function mostrar(p){
  actualP = p;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.p===p));
  document.querySelectorAll('.page').forEach(x => x.classList.toggle('active', x.id==='page-'+p));
  ls.set(K.tab, p);
  // Los gráficos se dibujan con el ancho visible
  if(D && (p==='proyeccion' || p==='categorias')) try{ PAGINAS[p](); }catch(e){ console.error(e); }
}
let rsT, rsW = window.innerWidth;
window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => {
  if(Math.abs(window.innerWidth-rsW) < 20) return; rsW = window.innerWidth;
  if(D && (actualP==='proyeccion' || actualP==='categorias')) PAGINAS[actualP]();
}, 200); });
function irA(p, ancla, mes){
  if(mes && p==='tarjetas'){ UI.tarMes = mes; renderTarjetas(); }
  mostrar(p);
  if(ancla){ const el = $(ancla); if(el) setTimeout(() => el.scrollIntoView({behavior:'smooth', block:'start'}), 50); }
  else window.scrollTo({top:0});
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { mostrar(t.dataset.p); window.scrollTo({top:0}); }));

/* ── Privacidad ─────────────────────────────────────────────────────── */
function setPriv(on){
  document.body.classList.toggle('priv', on);
  $('b-priv').classList.toggle('on', on);
  $('b-priv').title = on ? 'Mostrar montos' : 'Ocultar montos';
  ls.set(K.priv, on ? '1' : '0');
}
$('b-priv').addEventListener('click', () => setPriv(!document.body.classList.contains('priv')));

/* ── Toast ──────────────────────────────────────────────────────────── */
let toastT;
function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

/* ── Configuración ──────────────────────────────────────────────────── */
function abrirConfig(){
  $('c-url').value = ls.get(K.url) || '';
  $('c-token').value = ls.get(K.token) || '';
  $('c-err').style.display = 'none';
  $('c-cancel').style.display = D ? '' : 'none';
  $('m-config').classList.add('on');
}
function cerrarConfig(){ $('m-config').classList.remove('on'); }
$('b-config').addEventListener('click', abrirConfig);
$('c-cancel').addEventListener('click', cerrarConfig);
$('c-save').addEventListener('click', async () => {
  const u = $('c-url').value.trim(), t = $('c-token').value.trim();
  const err = m => { $('c-err').textContent = m; $('c-err').style.display = ''; };
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(u)) return err('La URL tiene que ser la de la aplicación web de Apps Script (https://script.google.com/macros/s/…/exec).');
  if(!t) return err('Falta el token.');
  $('c-save').disabled = true; $('c-save').textContent = 'Probando…';
  try{
    const j = await pedir(u + (u.includes('?')?'&':'?') + 'token=' + encodeURIComponent(t));
    ls.set(K.url, u); ls.set(K.token, t);
    D = j; D_AT = new Date(); OFFLINE = false; ERROR = '';
    ls.set(K.cache, JSON.stringify({at:D_AT.toISOString(), d:j}));
    cerrarConfig(); render(); toast('Conectado a '+(j.planilla||'la planilla'));
  } catch(e){
    err(e.status===403 ? 'El token no coincide con el del Apps Script.' : e.message);
  } finally { $('c-save').disabled = false; $('c-save').textContent = 'Probar y guardar'; }
});
$('c-pin').addEventListener('click', () => { cerrarConfig(); pinNuevo(); });
$('c-lock').addEventListener('click', () => { cerrarConfig(); bloquear(); });
$('c-clear').addEventListener('click', () => {
  if(!confirm('Se borran la URL, el token, el PIN y los datos guardados en este dispositivo. La planilla no se toca.')) return;
  [K.url, K.token, K.pin, K.cache, K.priv, K.tab].forEach(ls.del);
  location.reload();
});
$('b-refresh').addEventListener('click', () => cargar(true));

/* ── Tirar para refrescar ───────────────────────────────────────────── */
(function(){
  let y0 = null, dy = 0;
  window.addEventListener('touchstart', e => { y0 = (window.scrollY<=0 && !document.querySelector('.modal-bg.on,.lock.on')) ? e.touches[0].clientY : null; dy = 0; }, {passive:true});
  window.addEventListener('touchmove', e => { if(y0==null) return; dy = e.touches[0].clientY - y0; $('ptr').classList.toggle('on', dy > 80); }, {passive:true});
  window.addEventListener('touchend', () => { if(y0!=null && dy > 80) cargar(true); y0 = null; $('ptr').classList.remove('on'); });
})();

/* ── PIN ────────────────────────────────────────────────────────────── */
async function hashPin(pin){
  const txt = 'misfinanzas:' + pin;
  if(window.crypto && crypto.subtle){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
  }
  let h = 5381; for(let i=0; i<txt.length; i++) h = ((h<<5)+h+txt.charCodeAt(i))|0;
  return 'd'+(h>>>0).toString(16);
}
const LOCK = {modo:'abrir', buf:'', primero:'', alAbrir:null};
function armarPad(){
  const keys = ['1','2','3','4','5','6','7','8','9','',  '0','borrar'];
  $('pad').innerHTML = keys.map(k => k==='' ? '<span></span>' : '<button'+(k==='borrar'?' class="nb"':'')+' data-k="'+k+'">'+k+'</button>').join('');
  $('pad').addEventListener('click', e => { const b = e.target.closest('button'); if(b) tecla(b.dataset.k); });
  document.addEventListener('keydown', e => {
    if(!$('lock').classList.contains('on')) return;
    if(/^\d$/.test(e.key)) tecla(e.key); else if(e.key==='Backspace') tecla('borrar');
  });
}
function pintarPuntos(){ [...$('pdots').children].forEach((d,i) => d.classList.toggle('f', i<LOCK.buf.length)); }
function msgLock(m, err){ $('lock-msg').textContent = m; $('lock-msg').classList.toggle('err', !!err); }
async function tecla(k){
  if(k==='borrar'){ LOCK.buf = LOCK.buf.slice(0,-1); pintarPuntos(); return; }
  if(LOCK.buf.length>=4) return;
  LOCK.buf += k; pintarPuntos();
  if(LOCK.buf.length<4) return;
  const pin = LOCK.buf;
  await new Promise(r => setTimeout(r, 120));
  LOCK.buf = ''; pintarPuntos();
  if(LOCK.modo==='abrir'){
    if(await hashPin(pin) === ls.get(K.pin)) desbloquear();
    else { sacudir(); msgLock('PIN incorrecto', true); }
  } else if(LOCK.modo==='nuevo'){
    LOCK.primero = pin; LOCK.modo = 'confirmar'; msgLock('Repetí el PIN');
  } else if(LOCK.modo==='confirmar'){
    if(pin===LOCK.primero){ ls.set(K.pin, await hashPin(pin)); toast('PIN guardado'); desbloquear(); }
    else { sacudir(); LOCK.modo = 'nuevo'; msgLock('No coinciden. Elegí un PIN de 4 dígitos', true); }
  }
}
function sacudir(){ const p = $('pdots'); p.classList.remove('shake'); void p.offsetWidth; p.classList.add('shake'); }
function bloquear(){ LOCK.modo = 'abrir'; LOCK.buf = ''; pintarPuntos(); msgLock('Ingresá tu PIN'); $('lock').classList.add('on'); }
function pinNuevo(){ LOCK.modo = 'nuevo'; LOCK.buf = ''; pintarPuntos(); msgLock('Elegí un PIN de 4 dígitos'); $('lock').classList.add('on'); }
function desbloquear(){
  $('lock').classList.remove('on');
  const fn = LOCK.alAbrir; LOCK.alAbrir = null; if(fn) fn();
}
// Se vuelve a bloquear si la app estuvo más de 2 minutos en segundo plano
let oculto = 0;
document.addEventListener('visibilitychange', () => {
  if(document.hidden){ oculto = Date.now(); return; }
  if(ls.get(K.pin) && oculto && Date.now()-oculto > 120000) bloquear();
  if(D_AT && Date.now()-D_AT > 5*60000) cargar(false);
  pintarActualizado();
});

/* ── Inicio ─────────────────────────────────────────────────────────── */
(function iniciar(){
  armarPad();
  setPriv(ls.get(K.priv)==='1');
  const tab = ls.get(K.tab); if(tab && $('page-'+tab)) mostrar(tab);
  leerCache();
  const seguir = () => { render(); cargar(false); };
  if(ls.get(K.pin)){ LOCK.alAbrir = seguir; bloquear(); }
  else { LOCK.alAbrir = seguir; pinNuevo(); }
  setInterval(pintarActualizado, 60000);
})();
</script>
